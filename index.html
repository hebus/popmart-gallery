<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop Mart – Galerie</title>
<style>
  :root { --bg:#f6f6f8; --card:#fff; --text:#1b1b1f; --muted:#6b6b76; --accent:#e60012; --border:#e2e2e8; --sel:#fdeaec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --card:#1c1c20; --text:#f0f0f3; --muted:#9a9aa6; --border:#2c2c33; --sel:#3a1a1e; }
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; }
  header { padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--border); }
  h1 { font-size:1.1rem; margin:0; color:var(--accent); }
  input[type=search] { flex:1 1 240px; min-width:0; padding:10px 14px; font-size:1rem; border:1px solid var(--border);
           border-radius:8px; background:var(--card); color:var(--text); }
  input[type=search]:focus { outline:2px solid var(--accent); border-color:transparent; }
  #count { color:var(--muted); font-size:.9rem; white-space:nowrap; }

  .layout { flex:1; min-height:0; display:grid; grid-template-columns:minmax(260px,360px) 1fr; }
  #list, #detail { overflow-y:auto; min-height:0; }
  #list { list-style:none; margin:0; padding:8px; border-right:1px solid var(--border); }
  #list li { display:flex; gap:10px; align-items:center; padding:8px; border-radius:8px; cursor:pointer; }
  #list li:hover { background:var(--card); }
  #list li[aria-selected=true] { background:var(--sel); }
  #list img { width:48px; height:48px; object-fit:cover; border-radius:6px; flex:none; background:var(--border); }
  #list .n { font-size:.9rem; line-height:1.3; }
  #list .m { font-size:.75rem; color:var(--muted); }
  #more { display:block; margin:10px auto; padding:8px 20px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  #more[hidden] { display:none; }

  #detail { padding:16px; }
  #detail h2 { margin:0 0 4px; font-size:1.2rem; }
  #detail .meta { color:var(--muted); font-size:.9rem; margin-bottom:14px; }
  #detail .meta a { color:var(--accent); }
  #back { display:none; margin-bottom:12px; padding:6px 12px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; }
  #grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr)); }
  .tile { position:relative; border-radius:10px; overflow:hidden; border:3px solid transparent; cursor:pointer; background:var(--border); }
  .tile img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
  .tile.in { border-color:var(--accent); }
  .tile .check { display:none; position:absolute; top:6px; left:6px; width:26px; height:26px; border-radius:50%;
                 background:var(--accent); color:#fff; font-weight:700; align-items:center; justify-content:center; }
  .tile.in .check { display:flex; }
  .tile.in img { opacity:.75; }
  .tile .zoom { position:absolute; top:6px; right:6px; width:30px; height:30px; border:0; border-radius:50%;
                background:rgba(0,0,0,.55); color:#fff; cursor:zoom-in; font-size:1rem; }
  #colBtn { padding:8px 14px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; font-size:.95rem; }
  #colBtn b { background:var(--accent); color:#fff; border-radius:10px; padding:1px 8px; margin-left:4px; }
  #drawer { position:fixed; top:0; right:0; bottom:0; width:min(100%,420px); background:var(--bg); border-left:1px solid var(--border);
            box-shadow:-4px 0 16px rgba(0,0,0,.25); z-index:20; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s; }
  #drawer.open { transform:none; }
  #drawer header { justify-content:space-between; flex-wrap:nowrap; }
  #drawer h2 { margin:0; font-size:1.05rem; }
  #drawer .acts button { padding:6px 10px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; margin-left:6px; }
  #colItems { flex:1; overflow-y:auto; padding:12px; display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); align-content:start; }
  .citem { position:relative; }
  .citem img { width:100%; aspect-ratio:1; object-fit:cover; display:block; border-radius:8px; border:1px solid var(--border); cursor:zoom-in; }
  .citem .rm { position:absolute; top:4px; right:4px; width:26px; height:26px; border:0; border-radius:50%; background:var(--accent); color:#fff; cursor:pointer; font-size:1rem; line-height:1; }
  .citem .nm { font-size:.7rem; color:var(--muted); margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #colEmpty { grid-column:1/-1; color:var(--muted); text-align:center; padding:40px 0; }
  dialog { z-index:30; }
  .placeholder { color:var(--muted); text-align:center; padding:60px 0; }

  dialog { border:0; padding:0; background:transparent; max-width:100vw; max-height:100vh; width:100%; height:100%; }
  dialog::backdrop { background:rgba(0,0,0,.85); }
  dialog .lb { width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
  dialog img { max-width:100%; max-height:100%; object-fit:contain; }

  @media (max-width: 700px) {
    .layout { grid-template-columns:1fr; }
    #list { border-right:0; }
    #detail { display:none; }
    .layout.detail-open #list { display:none; }
    .layout.detail-open #detail { display:block; }
    #back { display:inline-block; }
  }
</style>
</head>
<body>
<header>
  <h1>Pop Mart</h1>
  <input id="q" type="search" placeholder="Rechercher un produit par nom…" autofocus>
  <span id="count"></span>
  <button id="colBtn">Ma collection <b id="colCount">0</b></button>
</header>
<div class="layout" id="layout">
  <div style="overflow-y:auto;min-height:0" id="listwrap">
    <ul id="list" role="listbox"></ul>
    <button id="more" hidden>Afficher plus</button>
  </div>
  <section id="detail"><p class="placeholder">Sélectionnez un produit dans la liste.</p></section>
</div>
<aside id="drawer" aria-label="Ma collection">
  <header>
    <h2>Ma collection (<span id="colCount2">0</span>)</h2>
    <div class="acts"><button id="colExport">Exporter JSON</button><button id="colClear">Vider</button><button id="colClose" aria-label="Fermer">✕</button></div>
  </header>
  <div id="colItems"></div>
</aside>
<dialog id="dlg"><div class="lb" id="lb"></div></dialog>

<script src="products.js"></script>
<script>
  const BATCH = 100;
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const products = window.PRODUCTS.map((p) => ({ ...p, key: norm(p.name) }));
  const $ = (id) => document.getElementById(id);
  const img = (src, alt = '') => {
    const i = new Image();
    i.loading = 'lazy'; i.referrerPolicy = 'no-referrer'; i.alt = alt; i.src = encodeURI(src);
    return i;
  };
  let found = [], shown = 0, selectedId = null;

  function search() {
    const words = norm($('q').value).split(/\s+/).filter(Boolean);
    found = products.filter((p) => words.every((w) => p.key.includes(w)));
    $('count').textContent = `${found.length} produit(s)`;
    $('list').replaceChildren();
    shown = 0;
    more();
    if (!found.length) $('list').innerHTML = '<li style="cursor:default;color:var(--muted)">Aucun produit trouvé.</li>';
  }

  function more() {
    const frag = document.createDocumentFragment();
    for (const p of found.slice(shown, shown + BATCH)) {
      const li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.dataset.id = p.id;
      li.setAttribute('aria-selected', p.id === selectedId);
      const txt = document.createElement('div');
      txt.innerHTML = '<div class="n"></div><div class="m"></div>';
      txt.firstChild.textContent = p.name;
      txt.lastChild.textContent = `${p.images.length} image(s) · ${p.price} ${p.currency}`;
      li.append(p.images[0] ? img(p.images[0]) : document.createElement('span'), txt);
      li.onclick = () => select(p);
      frag.append(li);
    }
    $('list').append(frag);
    shown = Math.min(shown + BATCH, found.length);
    $('more').hidden = shown >= found.length;
  }

  function select(p) {
    selectedId = p.id;
    for (const li of $('list').children) li.setAttribute('aria-selected', li.dataset.id === p.id);
    const d = $('detail');
    d.innerHTML = '<button id="back">← Retour à la liste</button><h2></h2><div class="meta"></div><div id="grid"></div>';
    d.querySelector('h2').textContent = p.name;
    const meta = d.querySelector('.meta');
    meta.append(`${p.price} ${p.currency} · ${p.images.length} image(s) · `);
    const a = document.createElement('a');
    a.href = p.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Voir sur popmart.com';
    meta.append(a);
    const grid = d.querySelector('#grid');
    for (const src of p.images) {
      const tile = document.createElement('div');
      tile.className = 'tile' + (inCol(src) ? ' in' : '');
      tile.dataset.src = src;
      tile.title = 'Cliquer pour ajouter / retirer de la collection';
      const chk = document.createElement('span');
      chk.className = 'check'; chk.textContent = '✓';
      const z = document.createElement('button');
      z.className = 'zoom'; z.textContent = '⤢'; z.title = 'Agrandir';
      z.onclick = (e) => { e.stopPropagation(); zoom(src, p.name); };
      tile.append(img(src, p.name), chk, z);
      tile.onclick = () => toggle({ src, id: p.id, name: p.name });
      grid.append(tile);
    }
    d.querySelector('#back').onclick = () => $('layout').classList.remove('detail-open');
    $('layout').classList.add('detail-open');
    d.scrollTop = 0;
  }

  // ---- Collection (persistée dans localStorage) ----
  const KEY = 'popmart-collection';
  let collection = [];
  try { collection = JSON.parse(localStorage.getItem(KEY)) ?? []; } catch {}
  const inCol = (src) => collection.some((c) => c.src === src);
  const zoom = (src, alt) => { $('lb').replaceChildren(img(src, alt)); $('dlg').showModal(); };

  function toggle(item) {
    collection = inCol(item.src) ? collection.filter((c) => c.src !== item.src) : [...collection, item];
    saveAndRender();
  }

  function saveAndRender() {
    try { localStorage.setItem(KEY, JSON.stringify(collection)); } catch {}
    $('colCount').textContent = $('colCount2').textContent = collection.length;
    for (const t of document.querySelectorAll('.tile')) t.classList.toggle('in', inCol(t.dataset.src));
    const box = $('colItems');
    box.replaceChildren();
    if (!collection.length) {
      box.innerHTML = '<p id="colEmpty">Votre collection est vide.<br>Cliquez sur une image pour l\'ajouter.</p>';
      return;
    }
    for (const c of collection) {
      const d = document.createElement('div');
      d.className = 'citem';
      const i = img(c.src, c.name);
      i.onclick = () => zoom(c.src, c.name);
      const rm = document.createElement('button');
      rm.className = 'rm'; rm.textContent = '✕'; rm.title = 'Retirer de la collection';
      rm.onclick = () => toggle(c);
      const nm = document.createElement('div');
      nm.className = 'nm'; nm.textContent = c.name;
      d.append(i, rm, nm);
      box.append(d);
    }
  }
  function exportJson() {
    const byId = new Map(products.map((p) => [p.id, p]));
    const items = collection.map((c) => {
      const p = byId.get(c.id);
      return { image: c.src, productId: c.id, productName: c.name, productUrl: p?.url, price: p?.price, currency: p?.currency };
    });
    const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), count: items.length, items }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `popmart-collection-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  $('colExport').onclick = () => collection.length ? exportJson() : alert('La collection est vide.');
  $('colBtn').onclick = () => $('drawer').classList.toggle('open');
  $('colClose').onclick = () => $('drawer').classList.remove('open');
  $('colClear').onclick = () => { if (collection.length && confirm('Vider toute la collection ?')) { collection = []; saveAndRender(); } };

  $('dlg').addEventListener('click', () => $('dlg').close());
  let t;
  $('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(search, 200); });
  $('more').addEventListener('click', more);
  search();
  saveAndRender();
</script>
</body>
</html>
