<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop Mart – Galerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
  :root { --bg:#faf7f2; --card:#fff; --text:#1d1b19; --muted:#5f5a53; --accent:#1d1b19; --on-accent:#faf7f2; --border:#e4ddd2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --card:#1c1c20; --text:#f0eee9; --muted:#a09b92; --accent:#f0eee9; --on-accent:#1d1b19; --border:#2c2c33; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; overflow-wrap:anywhere; -webkit-tap-highlight-color:transparent; font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  button { font-family:inherit; cursor:pointer; touch-action:manipulation; }
  .wrap { max-width:960px; margin:0 auto; padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }

  .top { position:sticky; top:0; z-index:10; background:var(--bg); padding:max(12px, env(safe-area-inset-top)) 0 12px; border-bottom:1px solid var(--border); }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  h1 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:1.5rem; letter-spacing:-.02em; margin:0; }
  @media (min-width:640px) { h1 { font-size:1.75rem; } .top { padding-top:16px; } .bar { margin-bottom:14px; } }
  #pill { display:flex; align-items:center; gap:6px; min-height:44px; background:var(--accent); color:var(--on-accent); border:0; border-radius:999px; padding:0 14px; font-weight:700; font-size:.95rem; }
  #pill svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #pillCount { display:inline-block; }
  #q { width:100%; height:48px; padding:0 16px; font-size:1rem; font-family:inherit; border:1.5px solid var(--border); border-radius:14px; background:var(--card); color:var(--text); }
  #q:focus { outline:2px solid var(--accent); border-color:transparent; }
  .tabs { display:flex; gap:8px; margin-top:12px; }
  .tab { flex:1; min-height:44px; padding:0 12px; border:1.5px solid var(--border); border-radius:999px; background:var(--card); color:var(--text); font-size:.95rem; font-weight:500; transition:background .25s, color .25s, border-color .25s; }
  .tab.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:700; }
  .meta-row { display:flex; flex-direction:column; align-items:flex-start; gap:8px; margin:12px 0 2px; }
  #count { color:var(--muted); font-size:.85rem; }
  .tools { display:flex; flex-wrap:wrap; gap:8px; }
  .tools[hidden] { display:none; }
  .tools button { min-height:44px; padding:0 14px; border:1.5px solid var(--border); border-radius:999px; background:var(--card); color:var(--text); font-size:.9rem; }

  #grid { display:grid; gap:14px; grid-template-columns:repeat(2,minmax(0,1fr)); padding:10px 0 24px; }
  @media (min-width:640px) { #grid { grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); } }
  .card { background:var(--card); border:1.5px solid var(--border); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; }
  .pic { display:block; width:100%; padding:0; border:0; background:var(--border); }
  .pic img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
  .info { padding:12px 12px 14px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .name { font-size:.9rem; font-weight:700; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .row { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:2px 8px; margin-top:auto; padding-top:8px; min-width:0; }
  .price { font-weight:700; font-size:.95rem; }
  .add { position:relative; width:44px; height:44px; border-radius:50%; border:1.5px solid var(--text); background:var(--card); color:var(--text); display:flex; align-items:center; justify-content:center; padding:0;
         transition:background .25s, color .25s, border-color .25s; }
  .add.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .add svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  .add .i-check, .add.on .i-plus { display:none; }
  .add.on .i-check { display:block; }
  .burst { position:absolute; inset:-1.5px; border-radius:50%; border:3px solid var(--accent); pointer-events:none; }
  #more { display:block; margin:0 auto 32px; min-height:44px; padding:0 24px; border:0; border-radius:999px; background:var(--accent); color:var(--on-accent); font-weight:700; }
  #more[hidden], #empty[hidden] { display:none; }
  #empty { text-align:center; color:var(--muted); padding:56px 0; line-height:1.5; }
  #empty b { display:block; font-family:'Bricolage Grotesque',sans-serif; font-size:1.25rem; color:var(--text); margin-bottom:6px; }

  .owned { color:var(--muted); font-size:.78rem; }
  #detail { padding:16px 0 32px; }
  #detail[hidden], #catalog[hidden] { display:none; }
  #detail h2 { font-family:'Bricolage Grotesque',sans-serif; margin:0 0 4px; font-size:1.4rem; }
  #detail .meta { color:var(--muted); font-size:.9rem; margin-bottom:14px; }
  #detail .meta a { color:var(--text); }
  .back { min-height:44px; padding:0 16px; margin-bottom:12px; border:1.5px solid var(--border); border-radius:999px; background:var(--card); color:var(--text); font-weight:500; }
  #tiles { display:grid; gap:14px; grid-template-columns:repeat(2,minmax(0,1fr)); }
  @media (min-width:640px) { #tiles { grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); } }
  .tile { position:relative; border-radius:18px; overflow:hidden; border:2px solid var(--border); cursor:pointer; background:var(--card); transition:border-color .25s; }
  .tile img { width:100%; aspect-ratio:1; object-fit:cover; display:block; transition:opacity .25s; }
  .tile.in { border-color:var(--accent); }
  .tile.in img { opacity:.8; }
  .tile .add { position:absolute; right:8px; bottom:8px; }
  .tile .zoom { position:absolute; top:8px; right:8px; width:36px; height:36px; border:0; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; font-size:1rem; }
  #dlg { border:0; padding:0; background:transparent; max-width:100vw; max-height:100vh; max-height:100dvh; width:100%; height:100%; }
  .sheet { border:0; padding:0; background:transparent; width:min(420px, calc(100vw - 32px)); max-width:none; color:var(--text); overflow:visible; }
  .box { background:var(--bg); border:1.5px solid var(--border); border-radius:22px; padding:20px; display:flex; flex-direction:column; gap:12px; max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow-y:auto; }
  .box h2 { margin:0; font-family:'Bricolage Grotesque',sans-serif; font-size:1.25rem; }
  .box p { margin:0; color:var(--muted); font-size:.9rem; line-height:1.4; }
  .box p.warn { color:var(--text); font-weight:700; }
  #qr { background:#fff; padding:12px; border-radius:14px; align-self:center; width:min(100%,380px); }
  #qr svg { display:block; width:100%; height:auto; }
  .box video { width:100%; aspect-ratio:1; object-fit:cover; border-radius:14px; background:#000; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; }
  .btn { flex:1 1 140px; min-height:44px; padding:0 16px; border-radius:999px; border:1.5px solid var(--border); background:var(--card); color:var(--text); font-size:.95rem; font-weight:500; }
  .btn.ico { display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn .ico-svg { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:700; }
  .tools button:disabled { opacity:.45; cursor:not-allowed; }

  .bar-r { display:flex; align-items:center; gap:8px; }
  .preview { position:relative; width:min(100%,240px); aspect-ratio:1; align-self:center; border:0; padding:0; border-radius:16px; background:var(--border); color:var(--muted); font-size:.85rem; display:flex; align-items:center; justify-content:center; text-align:center; overflow:hidden; cursor:pointer; }
  .preview .ph { display:flex; flex-direction:column; gap:6px; padding:12px; }
  .preview .ph b { color:var(--text); font-size:1rem; }
  .cambadge { position:absolute; right:8px; bottom:8px; width:44px; height:44px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .cambadge svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .preview img { width:100%; height:100%; object-fit:cover; display:block; }
  .pic.missing::after { content:'Photo introuvable'; display:flex; align-items:center; justify-content:center; aspect-ratio:1; color:var(--muted); font-size:.8rem; }
  .tools .icon { width:44px; padding:0; display:inline-flex; align-items:center; justify-content:center; }
  .tools .ico-svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .tools .primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:700; }
  #empty .btn { flex:none; margin-top:16px; padding:0 20px; }
  .listed { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .iconbtn { position:relative; width:44px; height:44px; border-radius:50%; border:1.5px solid var(--border); background:var(--card); color:var(--text); display:flex; align-items:center; justify-content:center; padding:0; }
  .iconbtn[hidden], #bellBadge[hidden], #exBar[hidden] { display:none; }
  .iconbtn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #bellBadge { position:absolute; top:-4px; right:-4px; min-width:20px; height:20px; padding:0 5px; border-radius:999px; background:#d93025; color:#fff; font-size:.7rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .tab { padding:0 8px; font-size:.9rem; }
  .pills { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .pillbtn { min-height:44px; padding:0 14px; border-radius:999px; border:1.5px solid var(--border); background:var(--card); color:var(--text); font-size:.9rem; transition:background .25s, color .25s, border-color .25s; }
  .pillbtn.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:700; }
  .card { position:relative; }
  .ribbon { position:absolute; top:10px; left:0; background:var(--accent); color:var(--on-accent); font-size:.75rem; font-weight:700; padding:4px 10px 4px 8px; border-radius:0 999px 999px 0; pointer-events:none; }
  .card.tagged { border-color:var(--accent); }
  .kindrow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .badge { font-size:.75rem; font-weight:700; padding:3px 9px; border-radius:999px; border:1.5px solid var(--text); }
  .badge.sale { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .qtyb, .owner, .note, .contact, .listed { font-size:.78rem; color:var(--muted); }
  .contact { color:var(--text); font-weight:500; }
  .listed { font-weight:700; color:var(--text); }
  .listed[hidden], .contact[hidden], .ribbon[hidden], .proposer[hidden] { display:none; }
  .tagbtn { width:100%; min-height:44px; margin-top:8px; border-radius:999px; border:1.5px solid var(--text); background:var(--card); color:var(--text); font-weight:700; font-size:.88rem; transition:background .25s, color .25s, border-color .25s; }
  .tagbtn.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .tagbtn.ghost { border-color:var(--border); font-weight:500; }
  .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .acts .tagbtn { flex:1 1 90px; margin-top:0; }
  .stepper { display:flex; align-items:center; justify-content:space-between; gap:4px; margin-top:4px; }
  .sbtn { width:44px; height:44px; border-radius:50%; border:1.5px solid var(--border); background:var(--card); color:var(--text); font-size:1.3rem; line-height:1; padding:0; }
  .sbtn:disabled { opacity:.4; }
  .qty { font-weight:700; font-size:1rem; }
  .row2 { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; padding-top:8px; }
  .proposer { flex:1; min-height:44px; border-radius:999px; border:1.5px solid var(--text); background:var(--card); color:var(--text); font-weight:700; font-size:.82rem; padding:0 8px; }
  .box label { display:flex; flex-direction:column; gap:4px; font-size:.85rem; color:var(--muted); }
  .box input, .box select { width:100%; height:48px; padding:0 14px; font-size:1rem; font-family:inherit; border:1.5px solid var(--border); border-radius:12px; background:var(--card); color:var(--text); }
  .box .pills { margin-top:0; }
  .notifs { display:flex; flex-direction:column; gap:10px; }
  .notif { display:flex; gap:10px; padding:10px; border:1.5px solid var(--border); border-radius:14px; background:var(--card); }
  .notif.unread { border-color:var(--accent); }
  .notif img { width:52px; height:52px; border-radius:10px; object-fit:cover; flex:none; background:var(--border); }
  .notif .body { min-width:0; flex:1; display:flex; flex-direction:column; gap:4px; font-size:.88rem; line-height:1.35; }
  .notif .when { font-size:.75rem; color:var(--muted); }
  .notif .sm { display:flex; flex-wrap:wrap; gap:6px; }
  .notif .sm button { min-height:44px; padding:0 12px; border-radius:999px; border:1.5px solid var(--border); background:var(--card); color:var(--text); font-size:.82rem; }
  dialog::backdrop { background:rgba(0,0,0,.88); }
  .lb { width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:16px; }
  .lb .gal { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; align-items:center; }
  .lb .gal img { flex:none; max-width:92%; max-height:75vh; max-height:75dvh; object-fit:contain; scroll-snap-align:center; border-radius:12px; }
  .lb .cap { color:#fff; text-align:center; font-size:.9rem; }
  .lb .x { align-self:flex-end; width:44px; height:44px; border:0; border-radius:50%; background:rgba(255,255,255,.2); color:#fff; font-size:1.1rem; }
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="bar">
      <h1>Pop Mart</h1>
      <div class="bar-r">
        <button id="profileBtn" class="iconbtn" aria-label="Mon profil" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        </button>
        <button id="bell" class="iconbtn" aria-label="Notifications" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          <span id="bellBadge" hidden>0</span>
        </button>
        <button id="pill" aria-label="Voir ma collection">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
          <span id="pillCount">0</span>
        </button>
      </div>
    </div>
    <input id="q" type="search" placeholder="Rechercher une figurine" aria-label="Rechercher une figurine">
    <div class="tabs">
      <button class="tab on" id="tabAll">Catalogue</button>
      <button class="tab" id="tabMine">Collection</button>
      <button class="tab" id="tabEx">Échanges</button>
    </div>
  </div>
</div>
<main class="wrap">
  <div id="catalog">
    <div class="meta-row">
      <div class="tools" id="tools" hidden>
        <button id="colAdd" class="primary">+ Ajouter</button>
        <button id="colShare">Share</button>
        <button id="colScan" class="icon" aria-label="Scanner un QR code" title="Scanner un QR code"><svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 012-2h2M16 4h2a2 2 0 012 2v2M20 16v2a2 2 0 01-2 2h-2M8 20H6a2 2 0 01-2-2v-2"/><path d="M4 12h16"/></svg></button>
        <button id="colBackup" class="icon" aria-label="Sauvegarde de la collection" title="Sauvegarde de la collection"><svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button>
        <button id="colClear" class="icon" aria-label="Vider la collection" title="Vider la collection"><svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg></button>
      </div>
      <div id="count"></div>
    </div>
    <div id="exBar" hidden>
      <div class="pills" id="exScope"></div>
      <div class="pills" id="exKind"></div>
    </div>
    <div id="grid"></div>
    <div id="empty" hidden></div>
    <button id="more" hidden>Afficher plus</button>
  </div>
  <section id="detail" hidden></section>
</main>
<dialog id="dlg"><div class="lb" id="lb"></div></dialog>
<dialog id="sheet" class="sheet" aria-label="Partage de la collection"><div class="box" id="sheetBox"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="products.js"></script>
<script src="exchange.js"></script>
<script>
  const BATCH = 40;
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const products = window.PRODUCTS.map((p) => ({ ...p, key: norm(p.name) }));
  const byId = new Map(products.map((p) => [p.id, p]));
  const $ = (id) => document.getElementById(id);
  // Photos des figurines perso : blobs JPEG dans IndexedDB (clé = uuid), jamais envoyées sur le réseau
  const photoStore = (() => {
    let dbp = null;
    const urls = new Map();
    const open = () => dbp ??= new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB indisponible'));
      const r = indexedDB.open('popmart', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => res(r.result);
      r.onerror = () => { dbp = null; rej(r.error); };
    });
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction('photos', mode);
        const req = fn(t.objectStore('photos'));
        t.oncomplete = () => res(req?.result);
        t.onerror = t.onabort = () => rej(t.error ?? new Error('Stockage impossible'));
      });
    };
    const revoke = (key, delay = 0) => {
      const u = urls.get(key);
      urls.delete(key);
      if (u) u.then((url) => url && setTimeout(() => URL.revokeObjectURL(url), delay));
    };
    const read = (key) => tx('readonly', (st) => st.get(key))
      .then((r) => (r instanceof Blob ? r : r ? new Blob([r.data], { type: r.type }) : null)).catch(() => null);
    return {
      async put(key, blob) { const data = await blob.arrayBuffer(); await tx('readwrite', (st) => st.put({ type: blob.type, data }, key)); revoke(key); },
      get(src) { return read(src.slice(6)); },
      url(src) {
        const key = src.slice(6);
        if (!urls.has(key)) urls.set(key, read(key).then((b) => (b ? URL.createObjectURL(b) : null)));
        return urls.get(key);
      },
      async delete(src) { const key = src.slice(6); revoke(key, 1000); await tx('readwrite', (st) => st.delete(key)).catch(() => {}); },
      async clear() { for (const k of [...urls.keys()]) revoke(k, 1000); await tx('readwrite', (st) => st.clear()).catch(() => {}); },
    };
  })();

  const img = (src, alt = '') => {
    const i = new Image();
    i.loading = 'lazy'; i.referrerPolicy = 'no-referrer'; i.alt = alt;
    if (src.startsWith('local:')) photoStore.url(src).then((u) => { if (u) i.src = u; else i.closest?.('.pic')?.classList.add('missing'); });
    else i.src = encodeURI(src);
    return i;
  };

  // ---- Animations (GSAP). Sans GSAP ou avec prefers-reduced-motion, tout reste fonctionnel sans animation ----
  const fx = (() => {
    const g = window.gsap;
    const ok = !!g && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (ok && window.Flip) g.registerPlugin(window.Flip);
    const CLEAR = 'transform,opacity,visibility';
    return {
      intro() {
        if (ok) g.from('.bar, #q, .tabs', { y: -16, autoAlpha: 0, stagger: .08, duration: .5, ease: 'power3.out', clearProps: CLEAR });
      },
      cardsIn(els) {
        if (ok && els.length) g.from(els.slice(0, 16), { y: 28, scale: .94, autoAlpha: 0, stagger: { each: .04, amount: .45 }, duration: .5, ease: 'power3.out', clearProps: CLEAR });
      },
      detailIn(d) {
        if (!ok) return;
        g.from(d, { x: 40, autoAlpha: 0, duration: .35, ease: 'power3.out', clearProps: CLEAR });
        g.from(d.querySelectorAll('h2, .meta'), { y: 12, autoAlpha: 0, stagger: .06, duration: .4, ease: 'power2.out', clearProps: CLEAR });
        g.from(d.querySelectorAll('.tile'), { y: 28, scale: .94, autoAlpha: 0, stagger: { each: .04, amount: .5 }, duration: .5, ease: 'power3.out', clearProps: CLEAR });
      },
      backIn() {
        if (ok) g.from('#catalog', { x: -30, autoAlpha: 0, duration: .35, ease: 'power3.out', clearProps: CLEAR });
      },
      tilePulse(t) {
        if (ok) g.fromTo(t, { scale: .95 }, { scale: 1, duration: .7, ease: 'elastic.out(1,.4)', clearProps: 'transform' });
      },
      pop(btn, on) {
        if (!ok) return;
        g.fromTo(btn, { scale: .5 }, { scale: 1, duration: .55, ease: 'back.out(3)', clearProps: 'transform' });
        g.fromTo(btn.querySelector(on ? '.i-check' : '.i-plus'), { rotation: on ? -90 : 90, scale: .4 }, { rotation: 0, scale: 1, duration: .45, ease: 'back.out(2.5)', clearProps: 'transform' });
        if (on) {
          const ring = document.createElement('span');
          ring.className = 'burst';
          btn.append(ring);
          g.fromTo(ring, { scale: .8, opacity: .9 }, { scale: 2.2, opacity: 0, duration: .6, ease: 'power2.out', onComplete: () => ring.remove() });
        }
      },
      fly(from) {
        if (!ok || !from) return;
        const to = $('pill');
        const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
        const c = from.cloneNode(true);
        Object.assign(c.style, { position: 'fixed', left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px',
          margin: 0, zIndex: 50, pointerEvents: 'none', borderRadius: '18px', objectFit: 'cover', opacity: 1 });
        document.body.append(c);
        const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
        g.timeline({ onComplete: () => { c.remove(); this.bump(true); } })
          .to(c, { scale: .15, duration: .7, ease: 'power2.in' }, 0)
          .to(c, { x: dx, duration: .7, ease: 'power1.inOut' }, 0)
          .to(c, { y: dy, duration: .7, ease: 'power3.in' }, 0)
          .to(c, { opacity: .3, duration: .2 }, .5);
      },
      bump(strong) {
        if (!ok) return;
        g.fromTo('#pillCount', { scale: strong ? 1.8 : 1.3 }, { scale: 1, duration: .6, ease: 'elastic.out(1,.4)' });
        if (strong) g.fromTo('#pill', { rotation: -5 }, { rotation: 0, duration: .6, ease: 'elastic.out(1,.3)' });
      },
      state() { return ok && window.Flip ? window.Flip.getState('.card') : null; },
      reflow(state) { if (state) window.Flip.from(state, { duration: .45, ease: 'power3.out' }); },
      out(els, done) {
        if (!ok) return done();
        g.to(els, { scale: .5, rotation: -6, autoAlpha: 0, stagger: .02, duration: .28, ease: 'power2.in', onComplete: done });
      },
      emptyIn() {
        if (ok) g.from('#empty', { y: 16, autoAlpha: 0, duration: .4, ease: 'power2.out', clearProps: CLEAR });
      },
      tag(btn) {
        if (ok) g.fromTo(btn, { scale: .9 }, { scale: 1, duration: .5, ease: 'elastic.out(1,.4)', clearProps: 'transform' });
      },
      ribbonIn(r) {
        if (ok && r) g.from(r, { x: -30, autoAlpha: 0, duration: .35, ease: 'back.out(2)', clearProps: CLEAR });
      },
      notifIn(els) {
        if (ok && els.length) g.from([...els].slice(0, 12), { x: 30, autoAlpha: 0, stagger: .05, duration: .35, ease: 'power2.out', clearProps: CLEAR });
      },
      bell() {
        if (!ok) return;
        g.fromTo('#bell', { rotation: -18 }, { rotation: 0, duration: .8, ease: 'elastic.out(1,.3)' });
        g.fromTo('#bellBadge', { scale: 1.8 }, { scale: 1, duration: .5, ease: 'back.out(3)' });
      },
      sheetIn() {
        if (ok) g.from('#sheetBox', { y: 30, scale: .95, autoAlpha: 0, duration: .35, ease: 'power3.out', clearProps: CLEAR });
      },
      zoomIn() {
        if (ok) g.from('#lb', { scale: .9, autoAlpha: 0, duration: .35, ease: 'power3.out', clearProps: CLEAR });
      },
    };
  })();

  // ---- Collection : liste d'images {src, id, name} (localStorage) ----
  const KEY = 'popmart-collection';
  let collection = [];
  try {
    const raw = JSON.parse(localStorage.getItem(KEY)) ?? [];
    collection = raw.map((c) => {
      if (typeof c !== 'string') return c;
      const p = byId.get(c);
      return p && p.images[0] ? { src: p.images[0], id: p.id, name: p.name } : null;
    }).filter((c) => c && c.src).map((c) => ({ ...c, qty: Number.isInteger(c.qty) && c.qty >= 1 ? Math.min(c.qty, 99) : 1 }));
  } catch {}
  const inCol = (src) => collection.some((c) => c.src === src);
  const ownedCount = (id) => collection.filter((c) => c.id === id).length;
  const persist = () => {
    try { localStorage.setItem(KEY, JSON.stringify(collection)); } catch {}
    $('pillCount').textContent = collection.length;
    const shareable = collection.some((c) => !c.custom) || (Exchange.configured && collection.length > 0);
    $('colShare').disabled = !shareable;
    $('colShare').title = !shareable && collection.length ? 'Le partage des figurines perso nécessite le partage en ligne (indisponible).' : '';
  };

  // ---- Affichage ----
  let view = 'all', found = [], shown = 0, detailOpen = false, savedScroll = 0;

  const ICONS = '<svg class="i-plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>' +
                '<svg class="i-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';

  function addBtn(on, label) {
    const b = document.createElement('button');
    b.className = 'add' + (on ? ' on' : '');
    b.innerHTML = ICONS;
    b.setAttribute('aria-label', label);
    b.setAttribute('aria-pressed', on);
    return b;
  }

  function badgeText(p) {
    const n = ownedCount(p.id);
    return n ? `${n}/${p.images.length} en collection` : `${p.images.length} image(s)`;
  }

  // Carte produit du catalogue : un clic ouvre la liste de ses images
  function card(p) {
    const el = document.createElement('article');
    el.className = 'card';
    el.dataset.id = p.id;
    const pic = document.createElement('button');
    pic.className = 'pic';
    pic.setAttribute('aria-label', `Voir les images de ${p.name}`);
    pic.append(p.images[0] ? img(p.images[0], p.name) : document.createElement('span'));
    pic.onclick = () => openDetail(p);
    const info = document.createElement('div');
    info.className = 'info';
    info.innerHTML = '<div class="name"></div><div class="row"><span class="price"></span><span class="owned"></span></div>';
    info.querySelector('.name').textContent = p.name;
    info.querySelector('.price').textContent = `${p.price} ${p.currency}`;
    info.querySelector('.owned').textContent = badgeText(p);
    el.append(pic, info);
    return el;
  }

  // Carte d'une image de la collection : quantité, annonce, retrait
  function colCard(c) {
    const el = mk('article', 'card');
    el.dataset.src = c.src;
    const pic = mk('button', 'pic');
    pic.setAttribute('aria-label', `Agrandir ${c.name}`);
    pic.append(img(c.src, c.name));
    pic.onclick = () => zoom(c.src, c.name);
    const info = mk('div', 'info');
    const dec = mk('button', 'sbtn', '−'), inc = mk('button', 'sbtn', '+');
    dec.setAttribute('aria-label', `Un exemplaire de moins de ${c.name}`);
    inc.setAttribute('aria-label', `Un exemplaire de plus de ${c.name}`);
    dec.onclick = () => setQty(c, c.qty - 1);
    inc.onclick = () => setQty(c, c.qty + 1);
    const stepper = mk('div', 'stepper');
    stepper.append(dec, mk('span', 'qty'), inc);
    const prop = mk('button', 'proposer');
    prop.onclick = () => c.custom ? openFigureSheet(c) : openListingSheet(c);
    const rm = addBtn(true, `Retirer ${c.name} de ma collection`);
    rm.onclick = () => c.custom ? removeCustom(c) : toggle(c);
    const row = mk('div', 'row2');
    row.append(prop, rm);
    info.append(mk('div', 'name', c.name), stepper, mk('div', 'listed'), row);
    el.append(pic, info);
    paintCol(el, c);
    return el;
  }

  const listingKey = (c) => {
    const i = byId.get(c.id)?.images.indexOf(c.src) ?? -1;
    return i < 0 ? null : `${c.id}:${i}`;
  };

  function paintCol(el, c) {
    el.querySelector('.qty').textContent = `×${c.qty}`;
    el.querySelector('.sbtn').disabled = c.qty <= 1;
    const listed = el.querySelector('.listed');
    if (c.custom) {
      listed.hidden = false;
      listed.textContent = c.note ? `Ma figurine · ${c.note}` : 'Ma figurine';
      const edit = el.querySelector('.proposer');
      edit.hidden = false;
      edit.textContent = 'Modifier';
      return;
    }
    const l = myListings.get(listingKey(c));
    listed.hidden = !l;
    if (l) listed.textContent = `En annonce · ${kindLabel(l)} ×${l.qty}`;
    const prop = el.querySelector('.proposer');
    prop.hidden = !Exchange.configured;
    prop.textContent = l ? "Modifier l'annonce" : 'Proposer';
  }

  function refreshListed() {
    if (view !== 'mine') return;
    for (const el of $('grid').children) {
      const c = collection.find((x) => x.src === el.dataset.src);
      if (c) paintCol(el, c);
    }
  }

  function setQty(c, n) {
    n = Math.min(99, Math.max(1, n));
    if (n === c.qty) return;
    c.qty = n;
    persist();
    const el = [...$('grid').children].find((e) => e.dataset.src === c.src);
    if (el) { paintCol(el, c); fx.tilePulse(el); }
    reconcileListing(c, false);
  }

  // Une annonce ne peut jamais proposer plus d'exemplaires que la quantité possédée
  async function reconcileListing(c, removed) {
    const key = listingKey(c), l = key && myListings.get(key);
    if (!l) return;
    const max = removed ? 0 : c.qty;
    try {
      if (max < 1) { await Exchange.removeListing(l.id); myListings.delete(key); }
      else if (l.qty > max) myListings.set(key, await Exchange.publish({ product_id: l.product_id, image_index: l.image_index, kind: l.kind, price: l.price, qty: max, note: l.note }));
    } catch {}
    refreshListed();
  }

  function render() {
    if (view === 'ex') return exView();
    const words = norm($('q').value).split(/\s+/).filter(Boolean);
    found = (view === 'mine' ? collection : products).filter((p) => words.every((w) => norm(p.name).includes(w)));
    $('grid').replaceChildren();
    shown = 0;
    more(true);
    updateMeta();
  }

  function more(animate) {
    const els = found.slice(shown, shown + BATCH).map(view === 'mine' ? colCard : card);
    $('grid').append(...els);
    shown = Math.min(shown + BATCH, found.length);
    $('more').hidden = shown >= found.length;
    if (animate) fx.cardsIn(els);
  }

  const setEmpty = (title, text, ...extra) => $('empty').replaceChildren(mk('b', '', title), document.createTextNode(text), ...extra);
  const addAction = (name = '') => mkBtn(name ? `Ajouter « ${name} » à ma collection` : 'Ajouter une figurine', 'primary', () => openFigureSheet(null, name));

  function updateMeta() {
    const unit = view === 'mine' ? 'image(s)' : view === 'ex' ? 'annonce(s)' : 'produit(s)';
    $('count').textContent = `${found.length} ${unit}`;
    const e = $('empty');
    const empty = found.length === 0 && !(view === 'ex' && exLoading);
    const wasHidden = e.hidden;
    e.hidden = !empty;
    if (!empty) return;
    if (view === 'ex') {
      const hint = exScope === 'mine' ? "Vous n'avez publié aucune annonce. Proposez une figurine depuis l'onglet Collection."
        : exScope === 'interested' ? "Vous n'avez marqué aucun intérêt." : 'Aucune annonce pour le moment.';
      setEmpty(exError ? 'Échanges indisponibles' : 'Aucune annonce', exError ?? hint);
    } else if (view === 'mine' && !collection.length) setEmpty('Collection vide', 'Ouvrez un produit du catalogue et ajoutez ses images avec le bouton +, ou ajoutez votre propre figurine.', addAction());
    else {
      const q = $('q').value.trim().slice(0, 80);
      setEmpty('Aucun résultat', view === 'all' ? 'Introuvable dans le catalogue ? Ajoutez-la vous-même avec une photo.' : 'Essayez un autre nom.', addAction(q));
    }
    if (wasHidden) fx.emptyIn();
  }

  // ---- Détail d'un produit : toutes ses images, chacune ajoutable ----
  function leaveDetail() {
    detailOpen = false;
    $('detail').hidden = true;
    $('catalog').hidden = false;
  }

  function openDetail(p) {
    savedScroll = scrollY;
    const d = $('detail');
    d.innerHTML = '<button class="back" id="back">← Retour à la liste</button><h2></h2><div class="meta"></div><div id="tiles"></div>';
    d.querySelector('h2').textContent = p.name;
    const meta = d.querySelector('.meta');
    meta.append(`${p.price} ${p.currency} · ${p.images.length} image(s) · `);
    const a = document.createElement('a');
    a.href = p.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Voir sur popmart.com';
    meta.append(a);
    for (const src of p.images) {
      const item = { src, id: p.id, name: p.name };
      const on = inCol(src);
      const tile = document.createElement('div');
      tile.className = 'tile' + (on ? ' in' : '');
      tile.dataset.src = src;
      const pic = img(src, p.name);
      const z = document.createElement('button');
      z.className = 'zoom'; z.textContent = '⤢'; z.setAttribute('aria-label', 'Agrandir');
      z.onclick = (e) => { e.stopPropagation(); zoom(src, p.name); };
      const add = addBtn(on, 'Ajouter ou retirer de ma collection');
      tile.append(pic, z, add);
      tile.onclick = () => toggle(item, pic);
      $('tiles').append(tile);
    }
    d.querySelector('#back').onclick = closeDetail;
    detailOpen = true;
    $('catalog').hidden = true;
    d.hidden = false;
    scrollTo({ top: 0 });
    fx.detailIn(d);
  }

  function closeDetail() {
    if (!detailOpen) return;
    leaveDetail();
    if (view === 'all') for (const el of $('grid').children) el.querySelector('.owned').textContent = badgeText(byId.get(el.dataset.id));
    scrollTo({ top: savedScroll });
    fx.backIn();
  }

  function setView(v) {
    if (v === view && !detailOpen) return;
    if (detailOpen) leaveDetail();
    view = v;
    $('tabAll').classList.toggle('on', v === 'all');
    $('tabMine').classList.toggle('on', v === 'mine');
    $('tabEx').classList.toggle('on', v === 'ex');
    $('tools').hidden = v !== 'mine';
    $('exBar').hidden = v !== 'ex';
    if (v === 'ex') exItems = null;
    render();
    scrollTo({ top: 0 });
  }

  function syncTiles(src, animate) {
    for (const t of document.querySelectorAll('.tile')) {
      if (t.dataset.src !== src) continue;
      const on = inCol(src), btn = t.querySelector('.add');
      t.classList.toggle('in', on);
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-pressed', on);
      if (animate) { fx.pop(btn, on); fx.tilePulse(t); }
    }
  }

  function toggle(item, from) {
    if (inCol(item.src)) {
      collection = collection.filter((c) => c.src !== item.src);
      reconcileListing(item, true);
      persist(); fx.bump(false);
      syncTiles(item.src, true);
      if (view === 'mine' && !detailOpen) {
        const el = [...$('grid').children].find((c) => c.dataset.src === item.src);
        found = found.filter((f) => f.src !== item.src);
        shown = Math.max(0, shown - 1);
        const done = () => { const s = fx.state(); el.remove(); fx.reflow(s); updateMeta(); };
        if (el) fx.out(el, done); else updateMeta();
      }
    } else {
      collection = [...collection, { ...item, qty: 1 }];
      persist();
      syncTiles(item.src, true);
      fx.fly(from);
      if (!from) fx.bump(false);
    }
  }

  function zoom(src, alt) {
    const lb = $('lb');
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Fermer');
    x.onclick = () => $('dlg').close();
    const gal = document.createElement('div');
    gal.className = 'gal';
    gal.append(img(src, alt));
    lb.replaceChildren(x, gal);
    $('dlg').showModal();
    fx.zoomIn();
  }

  // ---- Figurines perso (photo appareil / galerie, nom) : stockées uniquement sur l'appareil ----
  const MAX_CUSTOM = 200;
  const newId = () => crypto.randomUUID?.() ?? `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;

  // Réduit à 1024 px et ré-encode en JPEG : supprime aussi les métadonnées EXIF (dont la localisation GPS)
  async function processPhoto(file, maxSide = 1024, quality = 0.82) {
    if (file.type && !file.type.startsWith('image/')) throw new Error("Ce fichier n'est pas une image.");
    if (file.size > 25 * 1024 * 1024) throw new Error('Image trop volumineuse (25 Mo maximum).');
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch {
      bmp = await new Promise((res, rej) => {
        const i = new Image(), u = URL.createObjectURL(file);
        i.onload = () => { URL.revokeObjectURL(u); res(i); };
        i.onerror = () => { URL.revokeObjectURL(u); rej(); };
        i.src = u;
      }).catch(() => { throw new Error("Format d'image non supporté par ce navigateur (essayez en JPEG ou PNG)."); });
    }
    const w = bmp.width ?? bmp.naturalWidth, h = bmp.height ?? bmp.naturalHeight;
    const k = Math.min(1, maxSide / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close?.();
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', quality));
    if (!blob) throw new Error('Impossible de traiter cette image.');
    return blob;
  }

  function storageError(e) {
    const detail = `${e?.name || 'Erreur'}${e?.message ? ': ' + e.message : ''}`;
    if (e?.name === 'QuotaExceededError') return `Stockage de l'appareil plein : libérez de l'espace puis réessayez. (${detail})`;
    if (/IndexedDB|SecurityError|InvalidStateError|UnknownError|mutation/i.test(detail)) return `Le navigateur bloque le stockage des photos (navigation privée ou stockage désactivé pour ce site ?). (${detail})`;
    return `Impossible d'enregistrer la photo. (${detail})`;
  }

  // existing : figurine à modifier ; presetName : nom prérempli (ex. depuis une recherche sans résultat)
  function openFigureSheet(existing, presetName = '') {
    if (!existing && collection.filter((c) => c.custom).length >= MAX_CUSTOM) return notice('Limite atteinte', `Vous ne pouvez pas ajouter plus de ${MAX_CUSTOM} figurines perso.`);
    let blob = null, busy = false, previewUrl = null;
    const preview = mk('button', 'preview');
    preview.type = 'button';
    preview.setAttribute('aria-label', 'Prendre une photo');
    const showPreview = (node) => {
      const badge = mk('span', 'cambadge');
      badge.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON_CAMERA}</svg>`;
      preview.replaceChildren(node, badge);
    };
    if (existing) showPreview(img(existing.src, existing.name));
    else { const ph = mk('span', 'ph'); ph.append(mk('b', '', 'Aucune photo'), mk('span', '', 'Touchez pour prendre une photo')); showPreview(ph); }
    preview.onclick = () => cam.click();
    const err = mk('p', 'warn'); err.hidden = true;
    const name = mk('input'); name.maxLength = 80; name.value = existing?.name ?? presetName; name.placeholder = 'Ex. Molly édition limitée';
    const note = mk('input'); note.maxLength = 140; note.value = existing?.note ?? ''; note.placeholder = 'Série, état, où vous l\'avez trouvée… (optionnel)';
    const qty = mk('input'); qty.type = 'number'; qty.min = '1'; qty.max = '99'; qty.step = '1'; qty.inputMode = 'numeric'; qty.value = existing?.qty ?? 1;
    const cam = mk('input'), gal = mk('input');
    for (const i of [cam, gal]) { i.type = 'file'; i.accept = 'image/*'; i.hidden = true; }
    cam.setAttribute('capture', 'environment');
    const save = mkBtn(existing ? 'Enregistrer' : 'Ajouter', 'primary', onSave);
    const update = () => { save.disabled = busy || !name.value.trim() || !(blob || existing); };
    const onFile = async (inp) => {
      const f = inp.files[0];
      inp.value = '';
      if (!f) return;
      err.hidden = true; busy = true; update();
      try {
        blob = await processPhoto(f);
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(blob);
        const i = new Image(); i.alt = 'Aperçu'; i.src = previewUrl;
        showPreview(i);
      } catch (e) { err.textContent = e.message || 'Impossible de lire cette photo.'; err.hidden = false; }
      busy = false; update();
    };
    cam.onchange = () => onFile(cam);
    gal.onchange = () => onFile(gal);
    name.oninput = update;
    async function onSave() {
      const label = name.value.trim(), n = Math.min(99, Math.max(1, Math.floor(Number(qty.value)) || 1));
      busy = true; update(); err.hidden = true;
      const fail = (m) => { err.textContent = m; err.hidden = false; busy = false; update(); };
      const id = existing ? existing.src.slice(6) : newId();
      try { if (blob) await photoStore.put(id, blob); }
      catch (e) { console.error('photoStore.put', e); return fail(storageError(e)); }
      try {
        if (existing) Object.assign(existing, { name: label, note: note.value.trim() || undefined, qty: n });
        else collection = [...collection, { src: `local:${id}`, id: `local:${id}`, name: label, note: note.value.trim() || undefined, qty: n, custom: true }];
        navigator.storage?.persist?.().catch(() => {});
        persist();
        closeSheet();
        if (view !== 'mine') setView('mine');
        else { const words = norm($('q').value).split(/\s+/).filter(Boolean); if (!words.every((w) => norm(label).includes(w))) $('q').value = ''; render(); }
        fx.bump(false);
      } catch (e) {
        console.error(e);
        fail(`Erreur inattendue (${e?.name}: ${e?.message})`);
      }
    }
    const photoBtns = mk('div', 'btns');
    photoBtns.append(iconBtn('Galerie', ICON_GALLERY, '', () => gal.click()));
    const btns = mk('div', 'btns');
    btns.append(save, mkBtn('Annuler', '', closeSheet));
    update();
    showSheet(
      mk('h2', '', existing ? 'Modifier ma figurine' : 'Ajouter une figurine'),
      preview, photoBtns, cam, gal,
      field('Nom (obligatoire)', name), field('Note', note), field('Quantité', qty),
      mk('p', '', "La photo reste sur cet appareil : elle n'est jamais envoyée. Vider les données du site la supprime."),
      err, btns,
    );
    $('sheet').addEventListener('close', () => { if (previewUrl) URL.revokeObjectURL(previewUrl); }, { once: true });
  }

  function removeCustom(c) {
    if (!confirm(`Supprimer « ${c.name} » et sa photo ?`)) return;
    toggle(c);
    photoStore.delete(c.src);
  }

  // ---- Sauvegarde / restauration par fichier (images du catalogue, quantités et figurines perso AVEC photos) ----
  // Format v1 : { app, version: 1, exportedAt, count, items: [ {type:'catalog', productId, imageIndex, image, quantity, …}
  //                                                           | {type:'custom', customId, name, note?, quantity, photo: 'data:image/jpeg;base64,…'} ] }
  const BACKUP_APP = 'popmart-gallery';
  const CUSTOM_ID_RE = /^[0-9a-z-]{8,64}$/i;
  const PHOTO_URL_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
  const ICON_DOWNLOAD = '<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>';
  const ICON_UPLOAD = '<path d="M12 15V3M7 8l5-5 5 5M4 21h16"/>';
  const fileToDataUrl = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });

  // shrink : photos ré-encodées à 640 px / qualité 0,7 (partage en ligne) ; onProgress(i, n) pour les figurines perso
  async function buildBackup({ shrink = false, onProgress } = {}) {
    const items = [];
    const total = collection.filter((c) => c.custom).length;
    let missing = 0, done = 0;
    for (const c of collection) {
      if (c.custom) {
        let blob = await photoStore.get(c.src);
        if (!blob) { missing++; continue; }
        if (shrink) blob = await processPhoto(blob, 640, 0.7);
        onProgress?.(++done, total);
        items.push({ type: 'custom', customId: c.src.slice(6), name: c.name, note: c.note, quantity: c.qty, photo: await fileToDataUrl(blob) });
      } else {
        const p = byId.get(c.id);
        items.push({ type: 'catalog', productId: c.id, imageIndex: p ? p.images.indexOf(c.src) : -1, image: c.src, productName: c.name,
          productUrl: p?.url, price: p?.price, currency: p?.currency, quantity: c.qty });
      }
    }
    return { backup: { app: BACKUP_APP, version: 1, exportedAt: new Date().toISOString(), count: items.length, items }, missing };
  }

  async function exportBackup() {
    const { backup, missing } = await buildBackup();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(backup, null, 1)], { type: 'application/json' }));
    a.download = `popmart-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    return { count: backup.count, missing };
  }

  async function readBackup(file) {
    if (file.size > 100 * 1024 * 1024) throw new Error('Fichier trop volumineux (100 Mo maximum).');
    return parseBackupText(await file.text());
  }

  // Le contenu est une donnée non fiable (fichier ou partage) : tout est validé, les photos sont ré-encodées à l'import
  function parseBackupText(text) {
    let data;
    try { data = JSON.parse(text); } catch { throw new Error("Ce fichier n'est pas une sauvegarde valide."); }
    if (!Array.isArray(data?.items) || (data.app === BACKUP_APP && data.version !== 1) || (data.app !== BACKUP_APP && data.app !== undefined)) throw new Error("Ce fichier n'est pas une sauvegarde Pop Mart reconnue.");
    if (data.items.length > 2500) throw new Error('Sauvegarde trop volumineuse.');
    const catalog = [], custom = [], seen = new Set();
    let ignored = 0;
    for (const it of data.items) {
      if (!it || typeof it !== 'object') { ignored++; continue; }
      const qty = Number.isInteger(it.quantity) && it.quantity >= 1 ? Math.min(it.quantity, 99) : 1;
      if (it.type === 'custom') {
        const ok = typeof it.name === 'string' && it.name.trim() && typeof it.photo === 'string' && it.photo.length <= 6000000 && PHOTO_URL_RE.test(it.photo);
        if (!ok) { ignored++; continue; }
        const cid = typeof it.customId === 'string' && CUSTOM_ID_RE.test(it.customId) ? it.customId : newId();
        if (seen.has(cid)) continue;
        seen.add(cid);
        custom.push({ customId: cid, name: it.name.trim().slice(0, 80), note: typeof it.note === 'string' ? it.note.trim().slice(0, 140) || undefined : undefined, qty, photo: it.photo });
      } else {
        const p = typeof it.productId === 'string' && ID_RE.test(it.productId) ? byId.get(it.productId) : null;
        const src = !p ? null : typeof it.image === 'string' && p.images.includes(it.image) ? it.image : Number.isInteger(it.imageIndex) ? p.images[it.imageIndex] : null;
        if (!src) { ignored++; continue; }
        if (seen.has(src)) continue;
        seen.add(src);
        catalog.push({ src, id: p.id, name: p.name, qty });
      }
    }
    return { catalog, custom, ignored };
  }

  async function applyBackup(b, mode) {
    const status = mk('p', '', 'Préparation…');
    showSheet(mk('h2', '', 'Import en cours…'), status);
    let failed = 0;
    const room = Math.max(0, MAX_CUSTOM - (mode === 'merge' ? collection.filter((c) => c.custom).length : 0));
    const todo = b.custom.filter((c) => mode === 'replace' || !inCol(`local:${c.customId}`));
    failed += Math.max(0, todo.length - room);
    const ready = [];
    for (const [i, c] of todo.slice(0, room).entries()) {
      status.textContent = `Photos : ${i + 1}/${Math.min(todo.length, room)}`;
      try { ready.push({ c, blob: await processPhoto(await (await fetch(c.photo)).blob()) }); } catch { failed++; }
    }
    const custom = [];
    for (const { c, blob } of ready) {
      try { await photoStore.put(c.customId, blob); custom.push({ src: `local:${c.customId}`, id: `local:${c.customId}`, name: c.name, note: c.note, qty: c.qty, custom: true }); }
      catch { failed++; }
    }
    const old = collection;
    const fresh = b.catalog.filter((c) => mode === 'replace' || !inCol(c.src));
    collection = mode === 'replace' ? [...fresh, ...custom] : [...collection, ...fresh, ...custom];
    if (mode === 'replace') for (const c of old) if (c.custom && !collection.some((n) => n.src === c.src)) photoStore.delete(c.src);
    navigator.storage?.persist?.().catch(() => {});
    persist();
    closeSheet();
    if (view === 'mine') render(); else setView('mine');
    fx.bump(false);
    const skipped = b.ignored + failed;
    if (skipped) notice('Import terminé', `${fresh.length + custom.length} élément(s) importé(s). ${skipped} ignoré(s) (produit inconnu, photo illisible ou limite atteinte).`);
  }

  function askBackup(b) {
    const total = b.catalog.length + b.custom.length;
    if (!total) return notice('Sauvegarde vide', 'Aucun élément reconnu dans ce fichier.');
    const info = `${b.catalog.length} image(s) du catalogue · ${b.custom.length} figurine(s) perso` + (b.ignored ? ` · ${b.ignored} ignoré(s)` : '');
    if (!collection.length) return applyBackup(b, 'replace');
    const btns = mk('div', 'btns');
    btns.append(
      mkBtn('Fusionner', 'primary', () => applyBackup(b, 'merge')),
      mkBtn('Remplacer', '', () => { if (confirm(`Remplacer toute votre collection (${collection.length} élément(s)) par cette sauvegarde ?`)) applyBackup(b, 'replace'); }),
      mkBtn('Annuler', '', closeSheet),
    );
    showSheet(mk('h2', '', 'Sauvegarde reçue'), mk('p', '', info), mk('p', '', `Votre collection contient déjà ${collection.length} élément(s). Fusionner conserve vos quantités actuelles.`), btns);
  }

  function openBackup() {
    const status = mk('p', '');
    const file = mk('input');
    file.type = 'file'; file.accept = '.json,application/json'; file.hidden = true;
    file.onchange = async () => {
      const f = file.files[0];
      file.value = '';
      if (!f) return;
      status.textContent = 'Lecture du fichier…';
      try { askBackup(await readBackup(f)); } catch (e) { notice('Import impossible', e.message || 'Fichier illisible.'); }
    };
    const exp = iconBtn('Exporter', ICON_DOWNLOAD, 'primary', async () => {
      exp.disabled = true; status.textContent = 'Préparation du fichier…';
      try {
        const { count, missing } = await exportBackup();
        status.textContent = `Fichier téléchargé (${count} élément(s)).` + (missing ? ` ${missing} photo(s) introuvable(s) ignorée(s).` : '');
      } catch (e) { status.textContent = `Export impossible (${e?.name || 'erreur'}).`; }
      exp.disabled = false;
    });
    const btns = mk('div', 'btns');
    btns.append(exp, iconBtn('Importer', ICON_UPLOAD, '', () => file.click()), mkBtn('Fermer', '', closeSheet));
    const nCustom = collection.filter((c) => c.custom).length;
    showSheet(
      mk('h2', '', 'Sauvegarde de la collection'),
      mk('p', '', 'Un seul fichier avec vos images, vos quantités et vos figurines perso (photos incluses). Importez-le sur un autre appareil ou après avoir vidé les données du navigateur.'),
      mk('p', '', nCustom ? `${collection.length} élément(s), dont ${nCustom} figurine(s) perso avec photo.` : `${collection.length} élément(s).`),
      btns, file, status,
    );
  }

  // ---- Partage : lien `#c=<charge utile>` (id produit + indices d'images, jamais d'URL d'image) ----
  const BASE_URL = 'https://hebus.github.io/popmart-gallery/';
  const JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
  const MAX_PAYLOAD = 200000;
  const ID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

  const b64 = {
    enc(bytes) {
      let s = '';
      for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode(...bytes.subarray(i, i + 8192));
      return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    },
    dec(str) { return Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0)); },
  };

  async function deflate(bytes) {
    return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  }

  async function inflate(bytes, max = MAX_PAYLOAD) {
    const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
    const parts = [];
    let size = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      size += value.length;
      if (size > max) { reader.cancel(); throw new Error('Charge utile trop volumineuse'); }
      parts.push(value);
    }
    return new Blob(parts).text();
  }

  // Format v1 : `1|<idProduit>:<i,j,k>|<idProduit2>:<i>…` ; préfixe `z` (deflate) ou `r` (brut)
  async function encodeCollection(items) {
    const byProduct = new Map();
    let images = 0;
    for (const c of items) {
      const i = byId.get(c.id)?.images.indexOf(c.src) ?? -1;
      if (i < 0) continue;
      if (!byProduct.has(c.id)) byProduct.set(c.id, []);
      byProduct.get(c.id).push(i);
      images++;
    }
    const raw = new TextEncoder().encode('1|' + [...byProduct].map(([id, idx]) => `${id}:${idx.join(',')}`).join('|'));
    let payload = 'r' + b64.enc(raw);
    if (window.CompressionStream) { try { payload = 'z' + b64.enc(await deflate(raw)); } catch {} }
    return { payload, products: byProduct.size, images };
  }

  // La charge utile vient de l'extérieur : tout est validé, rien n'est injecté en HTML
  async function decodeCollection(payload) {
    if (!/^[zr][A-Za-z0-9_-]+$/.test(payload) || payload.length > MAX_PAYLOAD) throw new Error('Lien invalide');
    const bytes = b64.dec(payload.slice(1));
    let text;
    if (payload[0] === 'z') {
      if (!window.DecompressionStream) throw new Error('Navigateur non compatible');
      text = await inflate(bytes);
    } else {
      text = new TextDecoder().decode(bytes);
    }
    const [version, ...parts] = text.split('|');
    if (version !== '1') throw new Error('Version de partage non supportée');
    const items = [], seen = new Set();
    let ignored = 0;
    for (const part of parts.slice(0, 2000)) {
      const [id, list = ''] = part.split(':');
      const idx = list.split(',').filter(Boolean).slice(0, 500);
      const p = ID_RE.test(id) ? byId.get(id) : null;
      if (!p) { ignored += idx.length || 1; continue; }
      for (const s of idx) {
        const i = Number(s);
        if (!Number.isInteger(i) || i < 0 || i >= p.images.length) { ignored++; continue; }
        const src = p.images[i];
        if (seen.has(src)) continue;
        seen.add(src);
        items.push({ src, id: p.id, name: p.name });
      }
    }
    return { items, ignored };
  }

  // ---- Partage chiffré : AES-GCM 256, clé dans le fragment `#` du lien (jamais envoyée au serveur) ----
  // Lien : BASE_URL#s=<id du partage>.<clé base64url, 43 car.> ; le serveur ne stocke que `base64url(iv(12) | AES-GCM(flag | contenu))`,
  // où flag 1 = JSON compressé (deflate-raw), 0 = JSON brut.
  const SHARE_ID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
  const SHARE_KEY_RE = /^[A-Za-z0-9_-]{43}$/;
  const SHARE_MAX_BYTES = 6 * 1024 * 1024;
  const SHARE_MAX_PLAIN = 60 * 1024 * 1024;

  async function encryptShare(obj) {
    const raw = new TextEncoder().encode(JSON.stringify(obj));
    let body = raw, flag = 0;
    if (window.CompressionStream) { try { body = await deflate(raw); flag = 1; } catch {} }
    const plain = new Uint8Array(body.length + 1);
    plain[0] = flag; plain.set(body, 1);
    const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain));
    const out = new Uint8Array(12 + ct.length);
    out.set(iv); out.set(ct, 12);
    if (out.length > SHARE_MAX_BYTES) throw Object.assign(new Error(`Collection trop volumineuse pour un partage en ligne (${(out.length / 1048576).toFixed(1)} Mo, maximum ${SHARE_MAX_BYTES / 1048576} Mo)`), { tooBig: true });
    return { data: b64.enc(out), key: b64.enc(new Uint8Array(await crypto.subtle.exportKey('raw', key))), bytes: out.length };
  }

  async function decryptShare(data, keyB64) {
    if (typeof data !== 'string' || !/^[A-Za-z0-9_-]+$/.test(data) || data.length > 8500000 || !SHARE_KEY_RE.test(keyB64)) throw new Error('Lien invalide');
    const bytes = b64.dec(data);
    if (bytes.length < 29) throw new Error('Lien invalide');
    let plain;
    try {
      const key = await crypto.subtle.importKey('raw', b64.dec(keyB64), { name: 'AES-GCM' }, false, ['decrypt']);
      plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12) }, key, bytes.subarray(12)));
    } catch { throw new Error('Lien invalide ou altéré : impossible de déchiffrer ce partage.'); }
    if (plain[0] === 1) {
      if (!window.DecompressionStream) throw new Error('Navigateur non compatible avec ce partage.');
      return inflate(plain.subarray(1), SHARE_MAX_PLAIN);
    }
    if (plain[0] === 0) return new TextDecoder().decode(plain.subarray(1));
    throw new Error('Partage non reconnu');
  }

  // ---- Fenêtre unique (partage, scanner, import, messages) ----
  const mk = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  };
  const mkBtn = (label, cls, onclick) => { const b = mk('button', 'btn ' + cls, label); b.onclick = onclick; return b; };
  const ICON_CAMERA = '<path d="M3 8a2 2 0 012-2h2l1.5-2h7L17 6h2a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3.5"/>';
  const ICON_GALLERY = '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-8 9"/>';
  // Bouton avec icône (SVG statique, jamais de données utilisateur dans le HTML)
  const iconBtn = (label, icon, cls, onclick) => {
    const b = mkBtn(label, 'ico ' + cls, onclick);
    b.insertAdjacentHTML('afterbegin', `<svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>`);
    return b;
  };
  let scanStream = null;
  const stopScan = () => { scanStream?.getTracks().forEach((tr) => tr.stop()); scanStream = null; };
  const closeSheet = () => { stopScan(); if ($('sheet').open) $('sheet').close(); };
  function showSheet(...nodes) {
    stopScan();
    $('sheetBox').replaceChildren(...nodes);
    if (!$('sheet').open) { $('sheet').showModal(); fx.sheetIn(); }
  }
  function notice(title, text) {
    const btns = mk('div', 'btns');
    btns.append(mkBtn('Fermer', 'primary', closeSheet));
    showSheet(mk('h2', '', title), mk('p', '', text), btns);
  }
  $('sheet').addEventListener('close', stopScan);
  $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeSheet(); });

  function qrNode(link) {
    if (!window.qrcode) return null;
    try {
      const q = window.qrcode(0, 'L');
      q.addData(link, 'Byte');
      q.make();
      const holder = mk('div');
      holder.id = 'qr';
      holder.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      return holder;
    } catch { return null; }
  }

  function linkButtons(link) {
    const copy = mkBtn('Copier le lien', 'primary', async () => {
      try { await navigator.clipboard.writeText(link); copy.textContent = 'Lien copié'; } catch { copy.textContent = 'Copie impossible'; }
      setTimeout(() => { copy.textContent = 'Copier le lien'; }, 1800);
    });
    const out = [copy];
    if (navigator.share) out.push(mkBtn('Partager…', '', () => navigator.share({ title: 'Ma collection Pop Mart', url: link }).catch(() => {})));
    return out;
  }

  // Avec des figurines perso, il faut un partage en ligne chiffré (les photos ne tiennent pas dans un QR)
  async function openShare() {
    if (!collection.length) return;
    if (collection.some((c) => c.custom) && Exchange.configured) return openEncryptedShare();
    return openLegacyShare('le partage en ligne est indisponible');
  }

  async function openEncryptedShare() {
    const status = mk('p', '', 'Préparation du partage chiffré…');
    const closeRow = mk('div', 'btns');
    closeRow.append(mkBtn('Fermer', '', closeSheet));
    showSheet(mk('h2', '', 'Partager ma collection'), status, closeRow);
    try {
      const { backup, missing } = await buildBackup({ shrink: true, onProgress: (i, n) => { status.textContent = `Photos : ${i}/${n}`; } });
      status.textContent = 'Chiffrement…';
      const { data, key, bytes } = await encryptShare(backup);
      status.textContent = `Envoi (${(bytes / 1048576).toFixed(1)} Mo)…`;
      const id = await Exchange.createShare(data);
      const link = `${BASE_URL}#s=${id}.${key}`;
      const nCustom = backup.items.filter((i) => i.type === 'custom').length;
      const nodes = [
        mk('h2', '', 'Partager ma collection'),
        mk('p', '', `${backup.count} élément(s), dont ${nCustom} figurine(s) perso avec photo. Lien chiffré, valable 24 h.`),
      ];
      if (missing) nodes.push(mk('p', 'warn', `${missing} photo(s) introuvable(s) non partagée(s).`));
      const qr = qrNode(link);
      nodes.push(qr ?? mk('p', 'warn', 'Générateur de QR code indisponible : copiez le lien.'));
      nodes.push(mk('p', '', "Scannez ce QR code avec l'appareil photo ou le scanner de l'appli. Les photos sont chiffrées : seul ce lien permet de les lire."));
      const btns = mk('div', 'btns');
      btns.append(...linkButtons(link));
      const stop = mkBtn('Arrêter le partage', '', async () => {
        stop.disabled = true;
        try { await Exchange.deleteShare(id); notice('Partage arrêté', 'Ce lien ne fonctionne plus.'); }
        catch (e) { stop.disabled = false; notice('Action impossible', e.message); }
      });
      btns.append(stop, mkBtn('Fermer', '', closeSheet));
      showSheet(...nodes, btns);
    } catch (e) {
      openLegacyShare(`partage en ligne impossible (${e.message || 'erreur'})`);
    }
  }

  // QR sans serveur : images du catalogue uniquement (jamais d'URL d'image ni de photo)
  async function openLegacyShare(why) {
    if (!collection.length) return;
    const { payload, products: np, images } = await encodeCollection(collection);
    const link = BASE_URL + '#c=' + payload;
    const btns = mk('div', 'btns');
    const nodes = [mk('h2', '', 'Partager ma collection'), mk('p', '', `${images} image(s) · ${np} produit(s)`)];
    const nCustom = collection.filter((c) => c.custom).length;
    if (nCustom) nodes.push(mk('p', 'warn', `${nCustom} figurine(s) perso non incluse(s) dans ce QR : ${why}. La sauvegarde par fichier les inclut avec leurs photos.`));
    const qr = images ? qrNode(link) : null;
    if (qr) nodes.push(qr, mk('p', '', "Scannez ce QR code avec l'appareil photo ou avec le scanner de l'appli popmart."));
    else nodes.push(mk('p', 'warn', !images ? "Aucune image du catalogue à partager par ce QR. Utilisez la sauvegarde par fichier." : window.qrcode ? `Collection trop grande pour un QR code (${np} produits). Utilisez la sauvegarde par fichier.` : 'Générateur de QR code indisponible (hors ligne ?). Utilisez la sauvegarde par fichier.'));
    if (qr && link.length > 1100) nodes.push(mk('p', '', "QR code très dense : si le scan échoue, augmentez la luminosité de l'écran ou utilisez « Copier le lien »."));
    if (qr) btns.append(...linkButtons(link));
    btns.append(mkBtn('Sauvegarde par fichier', '', openBackup), mkBtn('Fermer', '', closeSheet));
    showSheet(...nodes, btns);
  }

  // ---- Import (appareil photo => hash au chargement ; scanner intégré) ----
  function applyImport(items, mode) {
    const fresh = (list) => list.map((i) => ({ ...i, qty: 1 }));
    const own = collection.filter((c) => c.custom);
    collection = mode === 'merge' ? [...collection, ...fresh(items.filter((i) => !inCol(i.src)))] : [...own, ...fresh(items)];
    persist();
    closeSheet();
    if (view === 'mine') render(); else setView('mine');
  }

  function askImport(items, ignored) {
    const np = new Set(items.map((i) => i.id)).size;
    const skipped = ignored ? ` · ${ignored} ignorée(s) (produit inconnu de ce catalogue)` : '';
    if (!items.length) return notice('Collection vide', 'Aucune image reconnue dans ce lien.' + skipped);
    const nCat = collection.filter((c) => !c.custom).length;
    if (!nCat) { applyImport(items, 'replace'); if (ignored) notice('Collection importée', `${items.length} image(s)` + skipped); return; }
    const btns = mk('div', 'btns');
    btns.append(
      mkBtn('Fusionner', 'primary', () => applyImport(items, 'merge')),
      mkBtn('Remplacer', '', () => { if (confirm(`Remplacer vos ${nCat} image(s) du catalogue par celles reçues ? Vos figurines perso sont conservées.`)) applyImport(items, 'replace'); }),
      mkBtn('Annuler', '', closeSheet),
    );
    showSheet(
      mk('h2', '', 'Collection reçue'),
      mk('p', '', `${items.length} image(s) · ${np} produit(s)` + skipped),
      mk('p', '', `Vous avez déjà ${nCat} image(s) du catalogue dans votre collection.`),
      btns,
    );
  }

  async function importShare(id, key) {
    const status = mk('p', '', 'Téléchargement…');
    showSheet(mk('h2', '', 'Collection reçue'), status);
    try {
      if (!SHARE_ID_RE.test(id) || !SHARE_KEY_RE.test(key)) throw new Error('Lien invalide');
      if (!Exchange.configured) throw new Error("Le partage en ligne n'est pas disponible dans cette version de l'appli.");
      let data;
      try { data = await Exchange.getShare(id); } catch { throw new Error('Impossible de joindre le serveur de partage (hors ligne ?).'); }
      if (!data) throw new Error('Ce partage a expiré ou a été arrêté.');
      status.textContent = 'Déchiffrement…';
      askBackup(parseBackupText(await decryptShare(data, key)));
    } catch (e) {
      notice('Import impossible', e.message || 'Lien invalide');
    }
  }

  async function importFromText(text) {
    const sm = /#s=([0-9a-f-]{36})\.([A-Za-z0-9_-]{43})/.exec(text);
    if (sm) return importShare(sm[1], sm[2]);
    const m = /#c=([A-Za-z0-9_-]+)/.exec(text);
    try {
      if (!m) throw new Error('Lien invalide');
      const { items, ignored } = await decodeCollection(m[1]);
      askImport(items, ignored);
    } catch (e) {
      notice('Import impossible', e.message || 'Lien invalide');
    }
  }

  const loadScript = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });

  async function openScanner() {
    const video = mk('video');
    video.setAttribute('playsinline', ''); video.muted = true;
    const msg = mk('p', '', "Visez le QR code d'une collection. Si la lecture échoue : rapprochez-vous, agrandissez le QR code, ou collez le lien ci-dessous.");
    const link = mk('input');
    link.type = 'text'; link.inputMode = 'url'; link.autocomplete = 'off'; link.placeholder = 'https://…/#…';
    const go = () => { const v = link.value.trim(); if (v) { stopScan(); importFromText(v); } };
    link.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    const btns = mk('div', 'btns');
    btns.append(mkBtn('Importer le lien', 'primary', go), mkBtn('Fermer', '', closeSheet));
    showSheet(mk('h2', '', 'Scanner une collection'), video, msg, field('Ou collez le lien de partage', link), btns);
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    } catch {
      msg.textContent = "Caméra indisponible ou refusée. Collez le lien de partage ci-dessous, ou scannez le QR avec l'appareil photo du téléphone.";
      return;
    }
    if (!$('sheet').open || $('sheetBox').firstChild.textContent !== 'Scanner une collection') { stream.getTracks().forEach((tr) => tr.stop()); return; }
    scanStream = stream;
    video.srcObject = stream;
    await video.play().catch(() => {});
    // BarcodeDetector existe dans certains navigateurs sans savoir lire les QR (ex. Chrome sur Windows) : on vérifie les formats
    let native = false;
    if ('BarcodeDetector' in window) { try { native = (await BarcodeDetector.getSupportedFormats()).includes('qr_code'); } catch {} }
    let detect;
    if (native) {
      const det = new BarcodeDetector({ formats: ['qr_code'] });
      detect = async () => (await det.detect(video))[0]?.rawValue;
    } else {
      try { await loadScript(JSQR_URL); } catch { msg.textContent = 'Décodeur de QR code indisponible (hors ligne ?). Collez le lien de partage ci-dessous.'; return; }
      const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
      detect = async () => {
        const k = Math.min(1, 1280 / video.videoWidth);
        canvas.width = Math.round(video.videoWidth * k); canvas.height = Math.round(video.videoHeight * k);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
        return window.jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' })?.data;
      };
    }
    const tick = async () => {
      if (scanStream !== stream) return;
      if (video.readyState >= 2 && video.videoWidth) {
        let text;
        try { text = await detect(); } catch {}
        if (scanStream !== stream) return;
        if (text && /#[cs]=/.test(text)) { stopScan(); importFromText(text); return; }
        if (text) msg.textContent = "Ce QR code n'est pas une collection Pop Mart.";
      }
      requestAnimationFrame(tick);
    };
    tick();
  }

  function importFromHash() {
    if (!/^#[cs]=/.test(location.hash)) return;
    const h = location.hash;
    history.replaceState(null, '', location.pathname + location.search);
    importFromText(h);
  }
  addEventListener('hashchange', importFromHash);

  // ---- Échanges / ventes, intérêts et notifications (Supabase, voir exchange.js) ----
  const myListings = new Map(); // `${productId}:${index}` -> annonce
  let exItems = null, exPage = 0, exMore = false, exError = null, exToken = 0, exLoading = false;
  let exScope = 'all', exKind = '', exInterests = new Set(), exContacts = new Map();

  const kindLabel = (l) => l.kind === 'sale' ? (l.price != null ? `Vente · ${Number(l.price).toLocaleString('fr-FR')} €` : 'Vente') : 'Échange';
  const field = (label, input) => { const l = mk('label', '', label); l.append(input); return l; };
  const pillBtn = (label, on, fn) => { const b = mk('button', 'pillbtn' + (on ? ' on' : ''), label); b.onclick = fn; return b; };

  function drawExBar() {
    const scopes = [['all', 'Toutes'], ['mine', 'Mes annonces'], ['interested', 'Mes intérêts']];
    $('exScope').replaceChildren(
      ...scopes.map(([k, l]) => pillBtn(l, exScope === k, () => { exScope = k; drawExBar(); loadEx(true); })),
    );
    const kinds = [['', 'Tous'], ['exchange', 'Échange'], ['sale', 'Vente']];
    $('exKind').replaceChildren(...kinds.map(([k, l]) => pillBtn(l, exKind === k, () => { exKind = k; drawExBar(); loadEx(true); })));
  }

  function exView() {
    drawExBar();
    if (exItems) drawEx(true); else loadEx(true);
  }

  async function loadEx(reset) {
    const token = ++exToken;
    if (reset) { exItems = []; exPage = 0; exMore = false; $('grid').replaceChildren(); $('more').hidden = true; }
    exError = null; exLoading = true;
    $('empty').hidden = true;
    $('count').textContent = 'Chargement…';
    try {
      const r = await Exchange.listListings({ kind: exKind || undefined, scope: exScope, page: exPage });
      if (token !== exToken) return;
      exItems = exItems.concat(r.items);
      exMore = r.more;
      exInterests = await Exchange.myInterestIds();
      const owners = exItems.filter((l) => exInterests.has(l.id)).map((l) => l.owner_id);
      exContacts = owners.length ? await Exchange.contactsOf(owners) : new Map();
    } catch (e) {
      if (token !== exToken) return;
      exError = e.message;
    }
    exLoading = false;
    if (view === 'ex') drawEx(reset);
  }

  function drawEx(animate) {
    const words = norm($('q').value).split(/\s+/).filter(Boolean);
    found = (exItems ?? []).map((l) => ({ l, p: byId.get(l.product_id) }))
      .filter(({ l, p }) => p && p.images[l.image_index] && words.every((w) => p.key.includes(w)));
    const els = found.map(({ l, p }) => exCard(l, p));
    $('grid').replaceChildren(...els);
    $('more').hidden = !exMore;
    updateMeta();
    if (animate) fx.cardsIn(els);
  }

  function exCard(l, p) {
    const src = p.images[l.image_index];
    const mine = l.owner_id === Exchange.me?.id;
    const el = mk('article', 'card');
    el.dataset.listing = l.id;
    const pic = mk('button', 'pic');
    pic.setAttribute('aria-label', `Agrandir ${p.name}`);
    pic.append(img(src, p.name));
    pic.onclick = () => zoom(src, p.name);
    const info = mk('div', 'info');
    const kind = mk('div', 'kindrow');
    kind.append(mk('span', 'badge ' + l.kind, kindLabel(l)), mk('span', 'qtyb', `×${l.qty}`));
    info.append(mk('div', 'name', p.name), kind, mk('div', 'owner', `par ${l.owner?.pseudo ?? '?'}`));
    if (l.note) info.append(mk('div', 'note', l.note));
    info.append(mk('div', 'contact'));
    const acts = mk('div', 'acts');
    if (mine) {
      const c = collection.find((x) => x.src === src);
      const edit = mk('button', 'tagbtn ghost', 'Modifier');
      edit.disabled = !c;
      edit.onclick = () => openListingSheet(c, l);
      const del = mk('button', 'tagbtn ghost', 'Retirer');
      del.onclick = () => removeMyListing(l, el);
      acts.append(edit, del);
    } else {
      const tag = mk('button', 'tagbtn');
      tag.onclick = () => toggleTag(l, el);
      acts.append(tag);
    }
    info.append(acts);
    el.append(pic, mk('span', 'ribbon', 'Intéressé'), info);
    paintTag(el, l);
    return el;
  }

  function paintTag(el, l) {
    const on = exInterests.has(l.id);
    el.classList.toggle('tagged', on);
    el.querySelector('.ribbon').hidden = !on;
    const tag = el.querySelector('.tagbtn:not(.ghost)');
    if (tag) {
      tag.classList.toggle('on', on);
      tag.setAttribute('aria-pressed', on);
      tag.textContent = on ? '✓ Intéressé·e' : "Ça m'intéresse";
    }
    const contact = el.querySelector('.contact'), value = on ? exContacts.get(l.owner_id) : '';
    contact.hidden = !value;
    contact.textContent = value ? `Contact : ${value}` : '';
  }

  async function toggleTag(l, el) {
    if (!(await requireProfile())) return;
    const btn = el.querySelector('.tagbtn'), on = !exInterests.has(l.id);
    btn.disabled = true;
    try {
      await Exchange.setInterest(l.id, on);
      if (on) { exInterests.add(l.id); exContacts = new Map([...exContacts, ...await Exchange.contactsOf([l.owner_id])]); }
      else exInterests.delete(l.id);
    } catch (e) { btn.disabled = false; return notice('Action impossible', e.message); }
    btn.disabled = false;
    if (!on && exScope === 'interested') {
      exItems = exItems.filter((x) => x.id !== l.id);
      found = found.filter((r) => r.l.id !== l.id);
      return fx.out(el, () => { const s = fx.state(); el.remove(); fx.reflow(s); updateMeta(); });
    }
    paintTag(el, l);
    fx.tag(btn);
    if (on) fx.ribbonIn(el.querySelector('.ribbon'));
  }

  async function removeMyListing(l, el) {
    if (!confirm('Retirer cette annonce ?')) return;
    try { await Exchange.removeListing(l.id); } catch (e) { return notice('Action impossible', e.message); }
    myListings.delete(`${l.product_id}:${l.image_index}`);
    exItems = exItems.filter((x) => x.id !== l.id);
    found = found.filter((r) => r.l.id !== l.id);
    fx.out(el, () => { const s = fx.state(); el.remove(); fx.reflow(s); updateMeta(); });
  }

  // ---- Profil (pseudo + contact), requis à la première écriture ----
  async function requireProfile() {
    if (!Exchange.configured) { notice('Échanges indisponibles', "Le service d'échanges n'est pas encore configuré."); return false; }
    try { if ((Exchange.me ?? await Exchange.loadMe())?.pseudo) return true; }
    catch (e) { notice('Échanges indisponibles', e.message); return false; }
    return askProfile();
  }

  async function askProfile() {
    if (!Exchange.configured) { notice('Échanges indisponibles', "Le service d'échanges n'est pas encore configuré."); return false; }
    const m = await Exchange.loadMe().catch(() => null);
    return new Promise((resolve) => {
      const pseudo = mk('input'), contact = mk('input');
