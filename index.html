      pseudo.maxLength = 20; pseudo.value = m?.pseudo ?? ''; pseudo.autocomplete = 'nickname'; pseudo.placeholder = 'Ex. FigurineFan';
      contact.maxLength = 120; contact.value = m?.contact ?? ''; contact.placeholder = 'Discord, email… (optionnel)';
      const err = mk('p', 'warn'); err.hidden = true;
      let done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      const save = mkBtn('Enregistrer', 'primary', async () => {
        save.disabled = true; err.hidden = true;
        try { await Exchange.saveProfile(pseudo.value, contact.value); finish(true); closeSheet(); initExchange(); }
        catch (e) { err.textContent = e.message; err.hidden = false; save.disabled = false; }
      });
      const btns = mk('div', 'btns');
      btns.append(save, mkBtn('Annuler', '', () => { finish(false); closeSheet(); }));
      $('sheet').addEventListener('close', () => finish(false), { once: true });
      showSheet(
        mk('h2', '', 'Mon profil'),
        mk('p', '', "Le pseudo est visible des autres utilisateurs. Le contact n'est montré qu'aux personnes liées à vos annonces par un intérêt."),
        field('Pseudo (3 à 20 caractères)', pseudo), field('Contact', contact),
        mk('p', '', 'Votre identité est liée à ce navigateur : vider ses données la fait perdre.'),
        err, btns,
      );
    });
  }

  // ---- Proposer une figurine à l'échange ou en vente (annonce) ----
  async function openListingSheet(c, existing) {
    if (!c || !(await requireProfile())) return;
    const p = byId.get(c.id), index = p ? p.images.indexOf(c.src) : -1;
    if (index < 0) return notice('Annonce impossible', 'Cette image ne fait plus partie du catalogue.');
    existing ??= myListings.get(`${c.id}:${index}`);
    let kind = existing?.kind ?? 'exchange';
    const max = c.qty;
    const qty = mk('select');
    for (let i = 1; i <= max; i++) qty.append(new Option(String(i), String(i)));
    qty.value = String(Math.min(existing?.qty ?? 1, max));
    const price = mk('input'); price.type = 'number'; price.min = '0'; price.max = '99999'; price.step = '0.01'; price.inputMode = 'decimal';
    price.placeholder = 'Prix en € (optionnel)'; price.value = existing?.price ?? '';
    const priceField = field('Prix', price);
    const note = mk('input'); note.maxLength = 140; note.placeholder = 'Ex. contre Molly, état neuf…'; note.value = existing?.note ?? '';
    const kinds = mk('div', 'pills');
    const drawKinds = () => {
      kinds.replaceChildren(pillBtn('Échange', kind === 'exchange', () => { kind = 'exchange'; drawKinds(); }), pillBtn('Vente', kind === 'sale', () => { kind = 'sale'; drawKinds(); }));
      priceField.hidden = kind !== 'sale';
    };
    drawKinds();
    const err = mk('p', 'warn'); err.hidden = true;
    const save = mkBtn(existing ? 'Mettre à jour' : 'Publier', 'primary', async () => {
      const raw = price.value.trim(), n = raw === '' ? null : Number(raw);
      if (kind === 'sale' && n !== null && !(n >= 0 && n <= 99999)) { err.textContent = 'Prix invalide.'; err.hidden = false; return; }
      save.disabled = true; err.hidden = true;
      try {
        const l = await Exchange.publish({ product_id: c.id, image_index: index, kind, price: n, qty: Number(qty.value), note: note.value.trim() });
        myListings.set(`${c.id}:${index}`, l);
        closeSheet(); refreshListed();
        if (view === 'ex') exItems = null, exView();
      } catch (e) { err.textContent = e.message; err.hidden = false; save.disabled = false; }
    });
    const btns = mk('div', 'btns');
    btns.append(save);
    if (existing) btns.append(mkBtn("Retirer l'annonce", '', async () => {
      try { await Exchange.removeListing(existing.id); myListings.delete(`${c.id}:${index}`); closeSheet(); refreshListed(); if (view === 'ex') exItems = null, exView(); }
      catch (e) { err.textContent = e.message; err.hidden = false; }
    }));
    btns.append(mkBtn('Annuler', '', closeSheet));
    showSheet(
      mk('h2', '', 'Proposer à l\'échange ou en vente'),
      mk('p', '', `${p.name} · vous en avez ${c.qty} dans votre collection, vous pouvez en proposer jusqu'à ${max}.`),
      kinds, priceField, field("Nombre d'exemplaires proposés", qty), field('Message (optionnel)', note), err, btns,
    );
  }

  // ---- Notifications ----
  let notifList = null;

  async function refreshBadge() {
    if (!Exchange.configured) return;
    let n = 0;
    try { n = await Exchange.unreadCount(); } catch {}
    const b = $('bellBadge'), prev = Number(b.textContent) || 0;
    b.textContent = n > 99 ? '99+' : n;
    b.hidden = !n;
    if (n > prev) fx.bell();
  }

  function notifItem(n) {
    const p = byId.get(n.listing?.product_id), src = p?.images[n.listing?.image_index];
    const el = mk('div', 'notif' + (n.read ? '' : ' unread'));
    const body = mk('div', 'body');
    const what = n.listing?.kind === 'sale' ? 'en vente' : "à l'échange";
    body.append(
      mk('div', '', `${n.from?.pseudo ?? 'Quelqu\'un'} est intéressé·e par « ${p?.name ?? 'une annonce'} » (${what})`),
      mk('div', 'when', new Date(n.created_at).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })),
      mk('div', 'contact', n.contact ? `Contact : ${n.contact}` : "Pas de contact renseigné : répondez via l'annonce."),
    );
    const sm = mk('div', 'sm');
    const act = (label, fn) => { const b = mk('button', '', label); b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { notice('Action impossible', e.message); return; } await fillNotifs(); refreshBadge(); }; return b; };
    if (!n.read) sm.append(act('Marquer lu', () => Exchange.markRead([n.id])));
    const see = mk('button', '', 'Voir mes annonces');
    see.onclick = () => { closeSheet(); exScope = 'mine'; exKind = ''; if (view === 'ex') { exItems = null; exView(); } else setView('ex'); };
    sm.append(see, act('Supprimer', () => Exchange.removeNotifications([n.id])));
    body.append(sm);
    el.append(src ? img(src, '') : mk('span'), body);
    return el;
  }

  async function fillNotifs() {
    if (!notifList) return;
    let rows;
    try { rows = await Exchange.listNotifications(); } catch (e) { if (notifList) notifList.replaceChildren(mk('p', 'warn', e.message)); return; }
    if (!notifList) return;
    if (!rows.length) { notifList.replaceChildren(mk('p', '', 'Aucune notification.')); return; }
    notifList.replaceChildren(...rows.map(notifItem));
    fx.notifIn(notifList.children);
  }

  async function openNotifications() {
    if (!Exchange.configured) return;
    notifList = mk('div', 'notifs');
    notifList.append(mk('p', '', 'Chargement…'));
    const run = (fn) => async () => { try { await fn(); } catch (e) { notice('Action impossible', e.message); return; } await fillNotifs(); refreshBadge(); };
    const btns = mk('div', 'btns');
    btns.append(
      mkBtn('Tout marquer lu', '', run(() => Exchange.markRead())),
      mkBtn('Tout supprimer', '', () => { if (confirm('Supprimer toutes les notifications ?')) run(() => Exchange.removeNotifications())(); }),
      mkBtn('Fermer', '', closeSheet),
    );
    showSheet(mk('h2', '', 'Notifications'), notifList, btns);
    $('sheet').addEventListener('close', () => { notifList = null; }, { once: true });
    await fillNotifs();
  }

  let unsubscribe = null;
  async function initExchange() {
    if (!Exchange.configured) return;
    $('bell').hidden = false;
    $('profileBtn').hidden = false;
    try {
      if (!await Exchange.loadMe()) return;
      unsubscribe?.();
      unsubscribe = await Exchange.subscribe(() => { refreshBadge(); fillNotifs(); });
      refreshBadge();
      myListings.clear();
      for (const l of await Exchange.myListingsAll()) myListings.set(`${l.product_id}:${l.image_index}`, l);
      refreshListed();
    } catch {}
  }

  $('tabAll').onclick = () => setView('all');
  $('tabMine').onclick = () => setView('mine');
  $('tabEx').onclick = () => setView('ex');
  $('bell').onclick = openNotifications;
  $('pill').onclick = () => setView('mine');
  $('profileBtn').onclick = () => askProfile();
  $('colAdd').onclick = () => openFigureSheet();
  $('colBackup').onclick = openBackup;
  $('colShare').onclick = openShare;
  $('colScan').onclick = openScanner;
  $('colClear').onclick = () => {
    const nCustom = collection.filter((c) => c.custom).length;
    if (!collection.length || !confirm(nCustom ? `Vider toute la collection ? Les ${nCustom} figurine(s) perso et leurs photos seront supprimées.` : 'Vider toute la collection ?')) return;
    if (nCustom) photoStore.clear();
    collection = [];
    persist();
    const els = [...document.querySelectorAll('.card')];
    found = []; shown = 0;
    fx.out(els, () => { $('grid').replaceChildren(); $('more').hidden = true; updateMeta(); });
  };
  $('more').onclick = () => { if (view === 'ex') { exPage++; loadEx(false); } else more(true); };
  $('dlg').addEventListener('click', (e) => { if (e.target === $('dlg') || e.target === $('lb')) $('dlg').close(); });
  let t;
  $('q').addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => { if (detailOpen) leaveDetail(); render(); }, 200);
  });

  persist();
  render();
  fx.intro();
  importFromHash();
  initExchange();
</script>
</body>
