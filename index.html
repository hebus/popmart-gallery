    msg.textContent = zxing || nativeCodes
      ? "Visez le code-barres d'un produit (pour le retrouver dans le catalogue) ou le QR code d'une collection. Si la lecture échoue : rapprochez-vous, ou saisissez le code / collez le lien ci-dessous."
      : "Lecteur de codes-barres indisponible (hors ligne ?) : saisissez le code ci-dessous (ou tapez-le dans la recherche). Les QR codes restent lisibles.";
    const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
    let frame = 0;
    const detect = async () => {
      const hit = det && (await det.detect(video))[0]?.rawValue;
      const useJs = jsqrReady && !nativeQr;
      if (hit || (!useJs && !zxing)) return hit;
      const k = Math.min(1, 1280 / video.videoWidth);
      canvas.width = Math.round(video.videoWidth * k); canvas.height = Math.round(video.videoHeight * k);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      // un seul décodeur logiciel par image, en alternance, pour ne pas saturer le processeur du téléphone
      if (zxing && (!useJs || frame++ % 2 === 0)) return zxing(canvas);
      const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
      return window.jsQR(d.data, d.width, d.height, { inversionAttempts: 'dontInvert' })?.data;
    };
    const tick = async () => {
      if (scanStream !== stream) return;
      if (video.readyState >= 2 && video.videoWidth) {
        let text;
        try { text = await detect(); } catch {}
        if (scanStream !== stream) return;
        if (text && BARCODE_RE.test(text)) { stopScan(); findByBarcode(text); return; }
        if (text && /#[cswp]=/.test(text)) { stopScan(); importFromText(text); return; }
        if (text) msg.textContent = "Ce code n'est ni un code-barres produit ni une collection, wishlist ou transfert Pop Mart.";
      }
      requestAnimationFrame(tick);
    };
    tick();
  }

  function importFromHash() {
    if (!/^#[cswp]=/.test(location.hash)) return;
    const h = location.hash;
    history.replaceState(null, '', location.pathname + location.search);
    importFromText(h);
  }
  addEventListener('hashchange', importFromHash);

  // ---- Transfert direct entre deux appareils (WebRTC) ----
  // Mise en relation : canal Supabase Realtime `popmart-p2p-<room>` ; tous les messages (offre, réponse, candidats ICE) sont chiffrés
  // AES-GCM avec une clé qui n'existe que dans le fragment du lien `#p=<room, 32 hex>.<clé, 43 car.>` (jamais envoyée au serveur) :
  // le serveur ne peut ni lire ni falsifier la négociation. Données : canal WebRTC (DTLS), jamais stockées nulle part. Le contenu est
  // le conteneur de packShare (v2) avec les photos en pleine qualité, sans le plafond de 6 Mo du partage en ligne.
  const P2P_RE = /#p=([0-9a-f]{32})\.([A-Za-z0-9_-]{43})/;
  const P2P_ICE = [{ urls: 'stun:stun.l.google.com:19302' }];
  const P2P_CHUNK = 16 * 1024;                  // taille sûre entre navigateurs
  const P2P_BUFFER = 4 * 1024 * 1024;           // contre-pression : on attend que la file d'envoi se vide
  const P2P_MAX_BYTES = 300 * 1024 * 1024;
  const P2P_WAIT_PEER = 5 * 60 * 1000, P2P_WAIT_LINK = 30 * 1000, P2P_WAIT_ACK = 60 * 1000;
  const P2P_CANCELLED = Symbol('p2p-cancelled');

  const hex = (n) => [...crypto.getRandomValues(new Uint8Array(n))].map((b) => b.toString(16).padStart(2, '0')).join('');
  const p2pKey = (keyB64) => crypto.subtle.importKey('raw', b64.dec(keyB64), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
  async function p2pSeal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
    const out = new Uint8Array(12 + ct.length);
    out.set(iv); out.set(ct, 12);
    return b64.enc(out);
  }
  async function p2pOpen(key, str) { // null si ce n'est pas un message authentique de l'autre appareil
    try {
      if (typeof str !== 'string' || str.length > 60000 || !/^[A-Za-z0-9_-]+$/.test(str)) return null;
      const bytes = b64.dec(str);
      return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12) }, key, bytes.subarray(12))));
    } catch { return null; }
  }

  const directUnavailable = () => !Exchange.configured ? "Le service de mise en relation (Supabase) n'est pas configuré."
    : !window.RTCPeerConnection || !crypto.subtle ? "Ce navigateur ne permet pas la connexion directe entre appareils."
    : !navigator.onLine ? 'Hors ligne : le transfert direct a besoin d\'internet pour mettre les deux appareils en relation.' : '';

  // role 'send' : attend le « hello » de l'autre appareil puis envoie l'offre ; 'recv' : dit « hello » puis répond.
  // Résout { dc, close } quand le canal de données est ouvert ; `signal` interrompt ; `onState(texte)` informe l'interface.
  async function p2pConnect(role, room, keyB64, { signal, onState = () => {} }) {
    const key = await p2pKey(keyB64);
    return new Promise((resolve, reject) => {
      let pc = null, chan = null, helloTimer = 0, timer = 0, settled = false, started = false, haveRemote = false;
      const queue = [];
      const stopSignal = () => { clearInterval(helloTimer); clearTimeout(timer); chan?.close(); };
      const fail = (e) => { if (settled) return; settled = true; stopSignal(); signal.removeEventListener('abort', onAbort); try { pc?.close(); } catch {} reject(e); };
      const onAbort = () => fail(P2P_CANCELLED);
      const arm = (ms, msg) => { clearTimeout(timer); timer = setTimeout(() => fail(new Error(msg)), ms); };
      const done = (dc) => {
        if (settled) return;
        settled = true; stopSignal(); signal.removeEventListener('abort', onAbort);
        resolve({ dc, close: () => { try { pc.close(); } catch {} } });
      };
      const send = (m) => p2pSeal(key, m).then((d) => chan.send({ d })).catch(() => {});
      const hook = (dc) => { dc.binaryType = 'arraybuffer'; if (dc.readyState === 'open') done(dc); else dc.onopen = () => done(dc); };
      const addIce = async (c) => { try { await pc.addIceCandidate(c); } catch {} };
      const flushIce = async () => { haveRemote = true; for (const c of queue.splice(0)) await addIce(c); };
      const makePc = () => {
        pc = new RTCPeerConnection({ iceServers: P2P_ICE });
        pc.onicecandidate = (e) => { if (e.candidate) send({ t: 'ice', c: e.candidate.toJSON() }); };
        pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') fail(new Error('Connexion directe impossible : appareils sur des réseaux différents ou réseau filtré ? Essayez sur le même Wi-Fi, ou utilisez le partage par lien.')); };
        pc.ondatachannel = (e) => hook(e.channel);
      };
      const onSig = async (payload) => {
        const m = await p2pOpen(key, payload?.d);
        if (!m || settled) return;
        if (role === 'send' && m.t === 'hello' && !started) {
          started = true;
          onState('Appareil détecté, connexion…');
          arm(P2P_WAIT_LINK, 'La connexion directe a échoué (délai dépassé).');
          makePc();
          hook(pc.createDataChannel('popmart', { ordered: true }));
          await pc.setLocalDescription(await pc.createOffer());
          send({ t: 'offer', sdp: pc.localDescription.toJSON() });
        } else if (role === 'recv' && m.t === 'offer' && !started) {
          started = true;
          clearInterval(helloTimer);
          onState('Connexion…');
          arm(P2P_WAIT_LINK, 'La connexion directe a échoué (délai dépassé).');
          makePc();
          await pc.setRemoteDescription(m.sdp);
          await flushIce();
          await pc.setLocalDescription(await pc.createAnswer());
          send({ t: 'answer', sdp: pc.localDescription.toJSON() });
        } else if (role === 'send' && m.t === 'answer' && started && !haveRemote) {
          await pc.setRemoteDescription(m.sdp);
          await flushIce();
        } else if (m.t === 'ice' && m.c) {
          if (pc && haveRemote) await addIce(m.c); else queue.push(m.c);
        }
      };
      if (signal.aborted) return reject(P2P_CANCELLED);
      signal.addEventListener('abort', onAbort, { once: true });
      chan = Exchange.openChannel('popmart-p2p-' + room, (p) => { onSig(p).catch(fail); });
      chan.ready.then(() => {
        if (role === 'recv') {
          onState("Recherche de l'autre appareil…");
          arm(P2P_WAIT_LINK, "L'autre appareil ne répond pas. Vérifiez qu'il affiche toujours le QR code.");
          send({ t: 'hello' });
          helloTimer = setInterval(() => send({ t: 'hello' }), 2500); // le « hello » n'est pas mis en file : on le répète jusqu'à l'offre
        } else {
          onState("En attente de l'autre appareil…");
          arm(P2P_WAIT_PEER, "Aucun appareil ne s'est connecté (5 minutes écoulées).");
        }
      }).catch(fail);
    });
  }

  const pctLabel = (n, total) => `${Math.floor((n * 100) / total)} %`;
  const p2pClosed = () => new Error("L'autre appareil s'est déconnecté avant la fin du transfert.");

  // Envoi : conteneur de packShare (photos pleine qualité) en blocs de 16 Ko avec contre-pression, puis attente de l'accusé de réception
  async function p2pSendAll(dc, { signal, onPrepare, onProgress }) {
    const alive = () => { if (signal.aborted) throw P2P_CANCELLED; if (dc.readyState !== 'open') throw p2pClosed(); };
    const { backup } = await buildBackup({ raw: true, onProgress: (i, n) => { alive(); onPrepare(i, n); } });
    const plain = await packShare(backup);
    if (plain.length > P2P_MAX_BYTES) throw new Error(`Collection trop volumineuse pour le transfert direct (${Math.round(plain.length / 1048576)} Mo, maximum ${P2P_MAX_BYTES / 1048576} Mo).`);
    alive();
    const ack = new Promise((resolve, reject) => {
      dc.onmessage = (e) => { try { const m = typeof e.data === 'string' && JSON.parse(e.data); if (m?.t === 'ack') resolve(m.ok !== false); } catch {} };
      dc.onclose = () => reject(p2pClosed());
    });
    ack.catch(() => {});
    dc.bufferedAmountLowThreshold = P2P_BUFFER / 4;
    dc.send(JSON.stringify({ t: 'start', size: plain.length }));
    let last = -1;
    for (let off = 0; off < plain.length; off += P2P_CHUNK) {
      while (dc.bufferedAmount > P2P_BUFFER) {
        alive();
        await new Promise((r) => { const t = setTimeout(r, 500); dc.addEventListener('bufferedamountlow', () => { clearTimeout(t); r(); }, { once: true }); });
      }
      alive();
      dc.send(plain.subarray(off, off + P2P_CHUNK));
      const p = Math.floor(((off + P2P_CHUNK) * 100) / plain.length);
      if (p !== last) { last = p; onProgress(Math.min(off + P2P_CHUNK, plain.length), plain.length); }
    }
    dc.send(JSON.stringify({ t: 'end' }));
    const ok = await Promise.race([ack, new Promise((_, rej) => setTimeout(() => rej(new Error("Pas d'accusé de réception de l'autre appareil : vérifiez qu'il a bien reçu la collection.")), P2P_WAIT_ACK))]);
    if (!ok) throw new Error("L'autre appareil n'a pas pu lire les données reçues.");
    return plain.length;
  }

  // Réception : assemble les blocs (taille annoncée vérifiée, jamais dépassée), puis unpackShare et parseBackupText valident tout
  function p2pReceiveAll(dc, { signal, onProgress }) {
    return new Promise((resolve, reject) => {
      const chunks = [];
      let size = -1, got = 0, finished = false, last = -1;
      const fail = (e) => { if (!finished) { finished = true; reject(e); } };
      signal.addEventListener('abort', () => fail(P2P_CANCELLED), { once: true });
      dc.onclose = () => fail(p2pClosed());
      dc.onmessage = async (e) => {
        if (finished) return;
        if (typeof e.data === 'string') {
          let m;
          try { m = JSON.parse(e.data); } catch { return fail(new Error('Transfert invalide.')); }
          if (m?.t === 'start') {
            if (size >= 0 || !Number.isInteger(m.size) || m.size < 7 || m.size > P2P_MAX_BYTES) return fail(new Error('Transfert invalide ou trop volumineux.'));
            size = m.size;
          } else if (m?.t === 'end') {
            if (size < 0 || got !== size) return fail(new Error('Transfert incomplet.'));
            finished = true;
            const nack = () => { try { dc.send(JSON.stringify({ t: 'ack', ok: false })); } catch {} };
            try {
              const plain = new Uint8Array(await new Blob(chunks).arrayBuffer());
              if (plain[0] !== 2) throw new Error('Transfert invalide.');
              resolve({ text: await unpackShare(plain), ack: (ok) => { try { dc.send(JSON.stringify({ t: 'ack', ok })); } catch {} } });
            } catch (err) { nack(); reject(err); }
          }
        } else {
          if (size < 0) return fail(new Error('Transfert invalide.'));
          got += e.data.byteLength;
          if (got > size) return fail(new Error('Transfert invalide.'));
          chunks.push(e.data);
          const p = Math.floor((got * 100) / size);
          if (p !== last) { last = p; onProgress(got, size); }
        }
      };
    });
  }

  // Fermer la fenêtre (Annuler, fond, Échap) interrompt tout
  function sheetAbort() {
    const ac = new AbortController();
    const onClose = () => ac.abort();
    $('sheet').addEventListener('close', onClose, { once: true });
    return { signal: ac.signal, release: () => $('sheet').removeEventListener('close', onClose) };
  }

  function openDirectMenu() {
    const btns = mk('div', 'btns');
    btns.append(
      mkBtn('Envoyer ma collection', 'primary', openDirectSend),
      mkBtn('Recevoir (scanner le QR)', '', openScanner),

    );
    showSheet(

    );

  async function openDirectSend() {
    const why = directUnavailable();
    if (why) return notice('Transfert direct indisponible', why);
    if (!collection.length && !folders.length) return notice('Collection vide', "Il n'y a rien à envoyer.");
    const room = hex(16), keyB64 = b64.enc(crypto.getRandomValues(new Uint8Array(32)));
    const link = `${BASE_URL}#p=${room}.${keyB64}`;
    const status = mk('p', 'warn', 'Connexion au service…');
    const qr = qrNode(link);
    const btns = mk('div', 'btns');
    btns.append(...linkButtons(link, 'Recevoir ma collection Pop Mart'), mkBtn('Annuler', '', closeSheet));
    showSheet(
      mk('h2', '', 'Envoyer à un autre appareil'),
      qr ?? mk('p', 'warn', 'Générateur de QR code indisponible : copiez le lien.'),
      mk('p', '', "Sur l'autre appareil : ouvrez Pop Mart, touchez l'icône de transfert puis « Recevoir », et scannez ce code (ou ouvrez le lien avec l'appareil photo). Gardez cet écran ouvert jusqu'à la fin."),
      status,
      mk('p', '', "Un serveur STUN public (Google) aide à trouver le chemin réseau : il voit l'adresse IP des appareils, jamais vos données. Fonctionne mieux sur le même Wi-Fi."),
      btns,
    );
    const { signal, release } = sheetAbort();
    let peer;
    try {
      peer = await p2pConnect('send', room, keyB64, { signal, onState: (s) => { status.textContent = s; } });
      status.textContent = 'Connecté : préparation des photos…';
      const bytes = await p2pSendAll(peer.dc, {
        signal,
        onPrepare: (i, n) => { status.textContent = `Préparation des photos : ${i}/${n}`; },
        onProgress: (n, total) => { status.textContent = `Envoi : ${pctLabel(n, total)} (${(total / 1048576).toFixed(1)} Mo)`; },
      });
      const closeRow = mk('div', 'btns');
      closeRow.append(mkBtn('Fermer', 'primary', closeSheet));
      showSheet(mk('h2', '', 'Transfert terminé'), mk('p', '', `✓ Collection envoyée (${(bytes / 1048576).toFixed(1)} Mo). L'autre appareil propose maintenant de fusionner ou de remplacer.`), closeRow);
    } catch (e) {
      if (e !== P2P_CANCELLED) notice('Transfert impossible', e.message || 'Erreur inconnue');
    } finally {
      release();
      setTimeout(() => peer?.close(), 1500);
    }
  }

  async function receiveDirect(room, keyB64) {
    const why = directUnavailable();
    if (why) return notice('Transfert direct indisponible', why);
    const status = mk('p', '', 'Connexion…');
    const btns = mk('div', 'btns');
    btns.append(mkBtn('Annuler', '', closeSheet));
    showSheet(mk('h2', '', 'Réception depuis un autre appareil'), status, btns);
    const { signal, release } = sheetAbort();
    let peer;
    try {
      peer = await p2pConnect('recv', room, keyB64, { signal, onState: (s) => { status.textContent = s; } });
      status.textContent = 'Connecté : réception…';
      const { text, ack } = await p2pReceiveAll(peer.dc, {
        signal,
        onProgress: (n, total) => { status.textContent = `Réception : ${pctLabel(n, total)} (${(total / 1048576).toFixed(1)} Mo)`; },
      });
      status.textContent = 'Vérification…';
      let parsed;
      try { parsed = parseBackupText(text); } catch (e) { ack(false); throw e; }
      ack(true);
      release();
      askBackup(parsed);
    } catch (e) {
      if (e !== P2P_CANCELLED) notice('Réception impossible', e.message || 'Erreur inconnue');
    } finally {
      release();
      setTimeout(() => peer?.close(), 2000);
    }
  }

  // ---- Échanges / ventes, intérêts et notifications (Supabase, voir exchange.js) ----
  const myListings = new Map(); // `${productId}:${index}` -> annonce
  let exItems = null, exPage = 0, exMore = false, exError = null, exToken = 0, exLoading = false;
  let exScope = 'all', exKind = '', exInterests = new Set(), exContacts = new Map();

  const kindLabel = (l) => l.kind === 'sale' ? (l.price != null ? `Vente · ${Number(l.price).toLocaleString('fr-FR')} €` : 'Vente') : 'Échange';
  const field = (label, input) => { const l = mk('label', '', label); l.append(input); return l; };
  const pillBtn = (label, on, fn) => { const b = mk('button', 'pillbtn' + (on ? ' on' : ''), label); b.onclick = fn; return b; };

  function drawExBar() {
    const scopes = [['all', 'Toutes'], ['mine', 'Mes annonces'], ['interested', 'Mes intérêts']];
    $('exScope').replaceChildren(
      ...scopes.map(([k, l]) => pillBtn(l, exScope === k, () => { exScope = k; drawExBar(); loadEx(true); })),
    );
    const kinds = [['', 'Tous'], ['exchange', 'Échange'], ['sale', 'Vente']];
    $('exKind').replaceChildren(...kinds.map(([k, l]) => pillBtn(l, exKind === k, () => { exKind = k; drawExBar(); loadEx(true); })));
  }

  function exView() {
    drawExBar();
    if (exItems) drawEx(true); else loadEx(true);
  }

  async function loadEx(reset) {
    const token = ++exToken;
    if (reset) { exItems = []; exPage = 0; exMore = false; $('grid').replaceChildren(); $('more').hidden = true; }
    exError = null; exLoading = true;
    $('empty').hidden = true;
    $('count').textContent = 'Chargement…';
    try {
      const r = await Exchange.listListings({ kind: exKind || undefined, scope: exScope, page: exPage });
      if (token !== exToken) return;
      exItems = exItems.concat(r.items);
      exMore = r.more;
      exInterests = await Exchange.myInterestIds();
      const owners = exItems.filter((l) => exInterests.has(l.id)).map((l) => l.owner_id);
      exContacts = owners.length ? await Exchange.contactsOf(owners) : new Map();
    } catch (e) {
      if (token !== exToken) return;
      exError = !navigator.onLine || /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Connexion indisponible : les échanges nécessitent internet.' : e.message;
    }
    exLoading = false;
    if (view === 'ex') drawEx(reset);
  }

  function drawEx(animate) {
    const words = norm($('q').value).split(/\s+/).filter(Boolean);
    found = (exItems ?? []).map((l) => ({ l, p: byId.get(l.product_id) }))
      .filter(({ l, p }) => p && p.images[l.image_index] && words.every((w) => p.key.includes(w)));
    const els = found.map(({ l, p }) => exCard(l, p));
    $('grid').replaceChildren(...els);
    $('more').hidden = !exMore;
    updateMeta();
    if (animate) fx.cardsIn(els);
  }

  function exCard(l, p) {
    const src = p.images[l.image_index];
    const mine = l.owner_id === Exchange.me?.id;
    const el = mk('article', 'card');
    el.dataset.listing = l.id;
    const pic = mk('button', 'pic');
    pic.setAttribute('aria-label', `Agrandir ${p.name}`);
    pic.append(img(src, p.name));
    pic.onclick = () => zoom(src, p.name);
    const info = mk('div', 'info');
    const kind = mk('div', 'kindrow');
    kind.append(mk('span', 'badge ' + l.kind, kindLabel(l)), mk('span', 'qtyb', `×${l.qty}`));
    info.append(mk('div', 'name', p.name), kind, mk('div', 'owner', `par ${l.owner?.pseudo ?? '?'}`));
    if (l.note) info.append(mk('div', 'note', l.note));
    info.append(mk('div', 'contact'));
    const acts = mk('div', 'acts');
    if (mine) {
      const c = collection.find((x) => x.src === src);
      const edit = mk('button', 'tagbtn ghost', 'Modifier');
      edit.disabled = !c;
      edit.onclick = () => openListingSheet(c, l);
      const del = mk('button', 'tagbtn ghost', 'Retirer');
      del.onclick = () => removeMyListing(l, el);
      acts.append(edit, del);
    } else {
      const tag = mk('button', 'tagbtn');
      tag.onclick = () => toggleTag(l, el);
      acts.append(tag);
    }
    info.append(acts);
    el.append(pic, mk('span', 'ribbon', 'Intéressé'), info);
    paintTag(el, l);
    return el;
  }

  function paintTag(el, l) {
    const on = exInterests.has(l.id);
    el.classList.toggle('tagged', on);
    el.querySelector('.ribbon').hidden = !on;
    const tag = el.querySelector('.tagbtn:not(.ghost)');
    if (tag) {
      tag.classList.toggle('on', on);
      tag.setAttribute('aria-pressed', on);
      tag.textContent = on ? '✓ Intéressé·e' : "Ça m'intéresse";
    }
    const contact = el.querySelector('.contact'), value = on ? exContacts.get(l.owner_id) : '';
    contact.hidden = !value;
    contact.textContent = value ? `Contact : ${value}` : '';
  }

  async function toggleTag(l, el) {
    if (!(await requireProfile())) return;
    const btn = el.querySelector('.tagbtn'), on = !exInterests.has(l.id);
    btn.disabled = true;
    try {
      await Exchange.setInterest(l.id, on);
      if (on) { exInterests.add(l.id); exContacts = new Map([...exContacts, ...await Exchange.contactsOf([l.owner_id])]); }
      else exInterests.delete(l.id);
    } catch (e) { btn.disabled = false; return notice('Action impossible', e.message); }
    btn.disabled = false;
    if (!on && exScope === 'interested') {
      exItems = exItems.filter((x) => x.id !== l.id);
      found = found.filter((r) => r.l.id !== l.id);
      return fx.out(el, () => { const s = fx.state(); el.remove(); fx.reflow(s); updateMeta(); });
    }
    paintTag(el, l);
    fx.tag(btn);
    if (on) fx.ribbonIn(el.querySelector('.ribbon'));
  }

  async function removeMyListing(l, el) {
    if (!confirm('Retirer cette annonce ?')) return;
    try { await Exchange.removeListing(l.id); } catch (e) { return notice('Action impossible', e.message); }
    myListings.delete(`${l.product_id}:${l.image_index}`);
    exItems = exItems.filter((x) => x.id !== l.id);
    found = found.filter((r) => r.l.id !== l.id);
    fx.out(el, () => { const s = fx.state(); el.remove(); fx.reflow(s); updateMeta(); });
  }

  // ---- Profil (pseudo + contact), requis à la première écriture ----
  async function requireProfile() {
    if (!Exchange.configured) { notice('Échanges indisponibles', "Le service d'échanges n'est pas encore configuré."); return false; }
    try { if ((Exchange.me ?? await Exchange.loadMe())?.pseudo) return true; }
    catch (e) { notice('Échanges indisponibles', e.message); return false; }
    return askProfile();
  }

  async function askProfile() {
    if (!Exchange.configured) { notice('Échanges indisponibles', "Le service d'échanges n'est pas encore configuré."); return false; }
    const m = await Exchange.loadMe().catch(() => null);
    return new Promise((resolve) => {
      const pseudo = mk('input'), contact = mk('input');
      pseudo.maxLength = 20; pseudo.value = m?.pseudo ?? ''; pseudo.autocomplete = 'nickname'; pseudo.placeholder = 'Ex. FigurineFan';
      contact.maxLength = 120; contact.value = m?.contact ?? ''; contact.placeholder = 'Discord, email… (optionnel)';
      const err = mk('p', 'warn'); err.hidden = true;
      let done = false;
      const finish = (v) => { if (!done) { done = true; resolve(v); } };
      const save = mkBtn('Enregistrer', 'primary', async () => {
        save.disabled = true; err.hidden = true;
        try { await Exchange.saveProfile(pseudo.value, contact.value); finish(true); closeSheet(); initExchange(); }
        catch (e) { err.textContent = e.message; err.hidden = false; save.disabled = false; }
      });
      const btns = mk('div', 'btns');
      btns.append(save, mkBtn('Annuler', '', () => { finish(false); closeSheet(); }));
      $('sheet').addEventListener('close', () => finish(false), { once: true });
      showSheet(
        mk('h2', '', 'Mon profil'),
        mk('p', '', "Le pseudo est visible des autres utilisateurs. Le contact n'est montré qu'aux personnes liées à vos annonces par un intérêt."),
        field('Pseudo (3 à 20 caractères)', pseudo), field('Contact', contact),
        mk('p', '', 'Votre identité est liée à ce navigateur : vider ses données la fait perdre.'),
        err, btns,
      );
    });
  }

  // ---- Proposer une figurine à l'échange ou en vente (annonce) ----
  async function openListingSheet(c, existing) {
    if (!c || !(await requireProfile())) return;
    const p = byId.get(c.id), index = p ? p.images.indexOf(c.src) : -1;
    if (index < 0) return notice('Annonce impossible', 'Cette image ne fait plus partie du catalogue.');
    existing ??= myListings.get(`${c.id}:${index}`);
    let kind = existing?.kind ?? 'exchange';
    const max = c.qty;
    const qty = mk('select');
    for (let i = 1; i <= max; i++) qty.append(new Option(String(i), String(i)));
    qty.value = String(Math.min(existing?.qty ?? 1, max));
    const price = mk('input'); price.type = 'number'; price.min = '0'; price.max = '99999'; price.step = '0.01'; price.inputMode = 'decimal';
    price.placeholder = 'Prix en € (optionnel)'; price.value = existing?.price ?? '';
    const priceField = field('Prix', price);
    const note = mk('input'); note.maxLength = 140; note.placeholder = 'Ex. contre Molly, état neuf…'; note.value = existing?.note ?? '';
    const kinds = mk('div', 'pills');
    const drawKinds = () => {
      kinds.replaceChildren(pillBtn('Échange', kind === 'exchange', () => { kind = 'exchange'; drawKinds(); }), pillBtn('Vente', kind === 'sale', () => { kind = 'sale'; drawKinds(); }));
      priceField.hidden = kind !== 'sale';
    };
    drawKinds();
    const err = mk('p', 'warn'); err.hidden = true;
    const save = mkBtn(existing ? 'Mettre à jour' : 'Publier', 'primary', async () => {
      const raw = price.value.trim(), n = raw === '' ? null : Number(raw);
      if (kind === 'sale' && n !== null && !(n >= 0 && n <= 99999)) { err.textContent = 'Prix invalide.'; err.hidden = false; return; }
      save.disabled = true; err.hidden = true;
      try {
        const l = await Exchange.publish({ product_id: c.id, image_index: index, kind, price: n, qty: Number(qty.value), note: note.value.trim() });
        myListings.set(`${c.id}:${index}`, l);
        closeSheet(); refreshListed();
        if (view === 'ex') exItems = null, exView();
      } catch (e) { err.textContent = e.message; err.hidden = false; save.disabled = false; }
    });
    const btns = mk('div', 'btns');
    btns.append(save);
    if (existing) btns.append(mkBtn("Retirer l'annonce", '', async () => {
      try { await Exchange.removeListing(existing.id); myListings.delete(`${c.id}:${index}`); closeSheet(); refreshListed(); if (view === 'ex') exItems = null, exView(); }
      catch (e) { err.textContent = e.message; err.hidden = false; }
    }));
    btns.append(mkBtn('Annuler', '', closeSheet));
    showSheet(
      mk('h2', '', 'Proposer à l\'échange ou en vente'),
      mk('p', '', `${p.name} · vous en avez ${c.qty} dans votre collection, vous pouvez en proposer jusqu'à ${max}.`),
      kinds, priceField, field("Nombre d'exemplaires proposés", qty), field('Message (optionnel)', note), err, btns,
    );
  }

  // ---- Notifications ----
  let notifList = null;

  async function refreshBadge() {
    if (!Exchange.configured) return;
    let n = 0;
    try { n = await Exchange.unreadCount(); } catch {}
    const b = $('bellBadge'), prev = Number(b.textContent) || 0;
    b.textContent = n > 99 ? '99+' : n;
    b.hidden = !n;
    if (n > prev) fx.bell();
  }

  function notifItem(n) {
    const p = byId.get(n.listing?.product_id), src = p?.images[n.listing?.image_index];
    const el = mk('div', 'notif' + (n.read ? '' : ' unread'));
    const body = mk('div', 'body');
    const what = n.listing?.kind === 'sale' ? 'en vente' : "à l'échange";
    body.append(
      mk('div', '', `${n.from?.pseudo ?? 'Quelqu\'un'} est intéressé·e par « ${p?.name ?? 'une annonce'} » (${what})`),
      mk('div', 'when', new Date(n.created_at).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })),
      mk('div', 'contact', n.contact ? `Contact : ${n.contact}` : "Pas de contact renseigné : répondez via l'annonce."),
    );
    const sm = mk('div', 'sm');
    const act = (label, fn) => { const b = mk('button', '', label); b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { notice('Action impossible', e.message); return; } await fillNotifs(); refreshBadge(); }; return b; };
    if (!n.read) sm.append(act('Marquer lu', () => Exchange.markRead([n.id])));
    const see = mk('button', '', 'Voir mes annonces');
    see.onclick = () => { closeSheet(); exScope = 'mine'; exKind = ''; if (view === 'ex') { exItems = null; exView(); } else setView('ex'); };
    sm.append(see, act('Supprimer', () => Exchange.removeNotifications([n.id])));
    body.append(sm);
    el.append(src ? img(src, '') : mk('span'), body);
    return el;
  }

  async function fillNotifs() {
    if (!notifList) return;
    let rows;
    try { rows = await Exchange.listNotifications(); } catch (e) { if (notifList) notifList.replaceChildren(mk('p', 'warn', e.message)); return; }
    if (!notifList) return;
    if (!rows.length) { notifList.replaceChildren(mk('p', '', 'Aucune notification.')); return; }
    notifList.replaceChildren(...rows.map(notifItem));
    fx.notifIn(notifList.children);
  }

  async function openNotifications() {
    if (!Exchange.configured) return;
    notifList = mk('div', 'notifs');
    notifList.append(mk('p', '', 'Chargement…'));
    const run = (fn) => async () => { try { await fn(); } catch (e) { notice('Action impossible', e.message); return; } await fillNotifs(); refreshBadge(); };
    const btns = mk('div', 'btns');
    btns.append(
      mkBtn('Tout marquer lu', '', run(() => Exchange.markRead())),
      mkBtn('Tout supprimer', '', () => { if (confirm('Supprimer toutes les notifications ?')) run(() => Exchange.removeNotifications())(); }),
      mkBtn('Fermer', '', closeSheet),
    );
    showSheet(mk('h2', '', 'Notifications'), notifList, btns);
    $('sheet').addEventListener('close', () => { notifList = null; }, { once: true });
    await fillNotifs();
  }

  let unsubscribe = null;
  async function initExchange() {
    if (!Exchange.configured) return;
    $('bell').hidden = false;
    $('profileBtn').hidden = false;
    try {
      if (!await Exchange.loadMe()) return;
      unsubscribe?.();
      unsubscribe = await Exchange.subscribe(() => { refreshBadge(); fillNotifs(); });
      refreshBadge();
      myListings.clear();
      for (const l of await Exchange.myListingsAll()) myListings.set(`${l.product_id}:${l.image_index}`, l);
      refreshListed();
    } catch {}
  }

  // ---- Dossiers : nom suggéré, création, déplacement, suppression, sélection multiple, glisser-déposer ----
  const GENERIC_FIRST = new Set(['the', 'mega', 'pop', 'baby', 'twinkle', 'sweet']); // premiers mots trop courants pour nommer un dossier
  const clip = (s) => s.trim().slice(0, MAX_FOLDER_NAME).trim();

  // Le catalogue n'a pas de champ famille/gamme : on déduit « <personnage> <série> » du nom du produit
  function seriesOf(name) {
    const s = name.replace(/[\[<][^\]>]*[\]>]/g, ' ').replace(/\s+/g, ' ').trim();
    const m = /^(.*?)\s*[-–—]?\s*\bseries\b/i.exec(s);
    if (m && m[1].trim()) return m[1].trim();
    return s.split(/\s+[-–—×]\s+|\s+x\s+|\s+with\s+/i)[0].trim();
  }

  // Nom identique > plus long préfixe de mots commun > préfixe majoritaire ; '' si rien de fiable
  function suggestFolderName(items) {
    const pool = items.some((c) => !c.custom) ? items.filter((c) => !c.custom) : items;
    const names = pool.map((c) => seriesOf(c.name)).filter(Boolean);
    if (!names.length) return '';
    if (names.every((n) => norm(n) === norm(names[0]))) return clip(names[0]);
    const words = names.map((n) => n.split(' '));
    let k = 0;
    while (words.every((w) => w[k] && norm(w[k]) === norm(words[0][k]))) k++;
    if (k >= 2 || (k === 1 && !GENERIC_FIRST.has(norm(words[0][0])))) return clip(words[0].slice(0, k).join(' '));
    for (const n of [2, 1]) {
      const count = new Map();
      for (const w of words) {
        if (w.length < n || (n === 1 && GENERIC_FIRST.has(norm(w[0])))) continue;
        const p = w.slice(0, n).join(' '), key = norm(p);
        count.set(key, [p, (count.get(key)?.[1] ?? 0) + 1]);
      }
      const best = [...count.values()].sort((a, b) => b[1] - a[1])[0];
      if (best && best[1] * 2 > words.length) return clip(best[0]);
    }
    return '';
  }

  const uniqueFolderName = (name, exceptId) => {
    const base = clip(name) || 'Dossier';
    let n = base, i = 2;
    while (folders.some((f) => f.id !== exceptId && norm(f.name) === norm(n))) n = `${base.slice(0, MAX_FOLDER_NAME - 5)} (${i++})`;
    return n;
  };

  // Demande le nom (prérempli) ; résout `null` si l'utilisateur annule ou ferme la fenêtre
  function askFolderName(initial, title = 'Nom du dossier', cta = 'Créer') {
    return new Promise((resolve) => {
      let done = false;
      const finish = (v) => {
        if (done) return;
        done = true;
        $('sheet').removeEventListener('close', onClose);
        closeSheet();
        resolve(v);
      };
      const onClose = () => finish(null);
      const input = mk('input');
      input.maxLength = MAX_FOLDER_NAME;
      input.value = initial || 'Nouveau dossier';
      input.placeholder = 'Ex. DIMOO Mood Forecast';
      const ok = mkBtn(cta, 'primary', () => finish(input.value.trim()));
      const update = () => { ok.disabled = !input.value.trim(); };
      input.oninput = update;
      input.onkeydown = (e) => { if (e.key === 'Enter' && input.value.trim()) finish(input.value.trim()); };
      const btns = mk('div', 'btns');
      btns.append(ok, mkBtn('Annuler', '', () => finish(null)));
      showSheet(mk('h2', '', title), field('Nom du dossier', input), btns);
      $('sheet').addEventListener('close', onClose);
      update();
      input.focus();
      input.select();
    });
  }

  // Repeint la collection après une modification (déplacement, création, suppression) : on coupe d'abord les animations
  // encore en cours sur les anciennes cartes pour qu'elles ne s'appliquent pas aux nouvelles, puis on force le calcul de mise en page.
  function refreshCol() {
    window.gsap?.killTweensOf('#grid .card');
    render();
    void $('grid').offsetHeight;
  }

  // Crée un dossier à la racine contenant `srcs` (peut être vide) après avoir demandé son nom
  async function createFolderFrom(srcs) {
    if (folders.length >= MAX_FOLDERS) { notice('Limite atteinte', `Vous ne pouvez pas créer plus de ${MAX_FOLDERS} dossiers.`); return null; }
    const items = [...new Set(srcs)].map((s) => collection.find((c) => c.src === s)).filter(Boolean);
    const name = await askFolderName(suggestFolderName(items));
    if (name == null) return null;
    const f = { id: newId(), name: uniqueFolderName(name) };
    folders = [...folders, f];
    for (const c of items) c.folder = f.id;
    persist();
    refreshCol();
    return f;
  }

  function moveItems(srcs, folderId) {
    const set = new Set(srcs);
    for (const c of collection) if (set.has(c.src)) { if (folderId) c.folder = folderId; else delete c.folder; }
    persist();
    refreshCol();
  }

  async function renameFolder(id) {
    const f = folderOf(id);
    if (!f) return;
    const name = await askFolderName(f.name, 'Renommer le dossier', 'Enregistrer');
    if (name == null) return;
    f.name = uniqueFolderName(name, id);
    persist();
    refreshCol();
  }

  // Un dossier non vide ne se supprime qu'après confirmation ; ses images retournent à la racine (rien n'est perdu)
  function deleteFolder(id) {
    const f = folderOf(id);
    if (!f) return;
    const items = folderItems(id);
    if (items.length && !confirm(`Supprimer le dossier « ${f.name} » ? Les ${items.length} image(s) qu'il contient seront remises à la racine de la collection (aucune image n'est supprimée).`)) return;
    for (const c of items) delete c.folder;
    folders = folders.filter((x) => x.id !== id);
    if (openFolder === id) openFolder = null;
    persist();
    refreshCol();
  }

  function openFolderView(id) {
    $('q').value = '';
    openFolder = id;
    render();
    scrollTo({ top: 0 });
  }

  function drawFolderBar(on) {
    $('colNewFolder').hidden = on; // pas de dossier dans un dossier
    $('folderBar').hidden = !on;
    if (!on) return;
    const f = folderOf(openFolder);
    const back = mk('button', 'back', '← Retour à la collection');
    back.id = 'folderBack';
    back.onclick = () => { setSelecting(false); openFolder = null; render(); scrollTo({ top: 0 }); };
    const btns = mk('div', 'btns');
    btns.append(mkBtn('Renommer', '', () => renameFolder(f.id)), mkBtn('Supprimer le dossier', '', () => deleteFolder(f.id)));
    $('folderBar').replaceChildren(back, mk('h2', '', f.name), btns);
  }

  // -- Sélection multiple (appui long, ou bouton « Sélectionner ») --
  function paintSel(el) {
    if (!el.dataset.src) return;
    const on = selected.has(el.dataset.src), pic = el.querySelector('.pic');
    el.classList.toggle('selected', on);
    if (selecting) pic?.setAttribute('aria-pressed', on); else pic?.removeAttribute('aria-pressed');
  }
  function updateSelBar() {
    $('selCount').textContent = selected.size ? `${selected.size} sélectionnée(s)` : 'Sélectionnez des images';
    $('selMove').disabled = !selected.size;
  }
  function setSelecting(on) {
    selecting = on;
    if (!on) selected.clear();
    $('grid').classList.toggle('selecting', on);
    document.body.classList.toggle('selecting', on);
    $('selBar').hidden = !on;
    $('colSelect').setAttribute('aria-pressed', on);
    for (const el of $('grid').children) paintSel(el);
    updateSelBar();
  }
  function toggleSelect(src) {
    if (!selecting) setSelecting(true);
    if (!selected.delete(src)) selected.add(src);
    const el = [...$('grid').children].find((e) => e.dataset.src === src);
    if (el) paintSel(el);
    updateSelBar();
  }

  function openMoveSheet() {
    if (!selected.size) return;
    const srcs = [...selected];
    const current = new Set(srcs.map((s) => collection.find((c) => c.src === s)?.folder ?? null));
    const list = mk('div', 'dest');
    const done = (folderId) => { closeSheet(); setSelecting(false); moveItems(srcs, folderId); };
    if ([...current].some(Boolean)) list.append(mkBtn('Racine de la collection (hors dossier)', '', () => done(null)));
    for (const f of folders) {
      if (current.size === 1 && current.has(f.id)) continue;
      list.append(mkBtn(`${f.name} (${folderItems(f.id).length})`, '', () => done(f.id)));
    }
    list.append(mkBtn('+ Nouveau dossier…', 'primary', async () => {
      const f = await createFolderFrom(srcs);
      if (f) setSelecting(false);
    }));
    const btns = mk('div', 'btns');
    btns.append(mkBtn('Annuler', '', closeSheet));
    showSheet(mk('h2', '', `Déplacer ${srcs.length} image(s)`), list, btns);
  }

  // -- Glisser-déposer par événements pointer (le DnD HTML5 est peu fiable sur iOS) --
  // Souris : glisser directement. Tactile : appui long (entre en sélection), puis glisser. Racine : sur une image => nouveau dossier, sur un dossier => déplacer ; dans un dossier : sur « Retour » => racine.
  let drag = null, suppressClick = false;
  const dragAllowed = () => view === 'mine' && !detailOpen && !norm($('q').value).trim();
  const swallowClick = () => { suppressClick = true; setTimeout(() => { suppressClick = false; }, 80); };

  function dropTarget(x, y) {
    const el = document.elementFromPoint(x, y)?.closest('.card[data-src], .card[data-folder], #folderBack');
    if (!el) return null;
    if (el.id === 'folderBack') return { type: 'root', el };
    if (openFolder) return null;
    if (el.dataset.folder) return { type: 'folder', id: el.dataset.folder, el };
    if (!drag.srcs.includes(el.dataset.src)) return { type: 'item', src: el.dataset.src, el };
    return null;
  }

  function markTarget() {
    const t = dropTarget(drag.x, drag.y);
    if (t?.el !== drag.target?.el) { drag.target?.el.classList.remove('droptarget'); t?.el.classList.add('droptarget'); }
    drag.target = t;
  }

  function autoScroll() {
    const top = document.querySelector('.top').getBoundingClientRect().bottom;
    if (drag.y < top + 40) scrollBy(0, -14); else if (drag.y > innerHeight - 70) scrollBy(0, 14);
    markTarget();
  }

  function dragMove(e) {
    drag.x = e.clientX; drag.y = e.clientY;
    drag.ghost.style.transform = `translate(${e.clientX - 48}px, ${e.clientY - 48}px)`;
    markTarget();
  }

  function dragStart(e) {
    const src = drag.el.dataset.src, c = collection.find((x) => x.src === src);
    if (!c) return dragEnd(false);
    drag.srcs = selecting && selected.has(src) ? [...selected] : [src];
    drag.mode = 'drag';
    const g = mk('div', 'ghost');
    g.append(img(c.src, c.name));
    if (drag.srcs.length > 1) g.append(mk('span', 'n', String(drag.srcs.length)));
    document.body.append(g);
    drag.ghost = g;
    drag.el.classList.add('dragsrc');
    document.body.classList.add('dragging');
    navigator.vibrate?.(10);
    dragMove(e);
    drag.scroller = setInterval(autoScroll, 16);
  }

  async function dropOn(srcs, t) {
    if (t.type === 'folder' || t.type === 'root') { setSelecting(false); moveItems(srcs, t.type === 'folder' ? t.id : null); }
    else if (await createFolderFrom([t.src, ...srcs])) setSelecting(false);
  }

  function dragEnd(commit) {
    const d = drag;
    if (!d) return;
    drag = null;
    clearTimeout(d.timer);
    removeEventListener('pointermove', dragMoveH);
    removeEventListener('pointerup', dragUpH);
    removeEventListener('pointercancel', dragUpH);
    if (d.mode === 'drag') {
      clearInterval(d.scroller);
      d.ghost.remove();
      d.el.classList.remove('dragsrc');
      d.target?.el.classList.remove('droptarget');
      document.body.classList.remove('dragging');
      swallowClick();
      if (commit && d.target) dropOn(d.srcs, d.target);
    } else if (d.mode === 'armed') swallowClick();
  }

  function longPress() {
    if (!drag || drag.mode !== 'wait') return;
    drag.mode = 'armed';
    navigator.vibrate?.(15);
    const src = drag.el.dataset.src;
    if (!selecting) setSelecting(true);
    if (!selected.has(src)) toggleSelect(src);
  }

  function dragMoveH(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    const dist = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
    if (drag.mode === 'wait') {
      if (drag.touch) { if (dist > 8) dragEnd(false); } // le doigt fait défiler : ce n'est pas un appui long
      else if (dist > 6 && dragAllowed()) dragStart(e);
    } else if (drag.mode === 'armed') { if (dist > 8 && dragAllowed()) dragStart(e); }
    else dragMove(e);
  }
  const dragUpH = (e) => { if (drag && e.pointerId === drag.pid) dragEnd(e.type === 'pointerup'); };

  $('grid').addEventListener('pointerdown', (e) => {
    if (view !== 'mine' || drag || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const el = e.target.closest('.card[data-src]');
    if (!el || e.target.closest('.sbtn, .proposer, .add')) return;
    drag = { el, pid: e.pointerId, x0: e.clientX, y0: e.clientY, mode: 'wait', touch: e.pointerType !== 'mouse' };
    if (drag.touch) drag.timer = setTimeout(longPress, 450);
    addEventListener('pointermove', dragMoveH);
    addEventListener('pointerup', dragUpH);
    addEventListener('pointercancel', dragUpH);
  });
  // Une fois l'appui long déclenché, le doigt ne doit plus faire défiler la page
  $('grid').addEventListener('touchmove', (e) => { if (drag && drag.mode !== 'wait' && e.cancelable) e.preventDefault(); }, { passive: false });
  $('grid').addEventListener('click', (e) => { if (suppressClick) { e.preventDefault(); e.stopPropagation(); } }, true);
  $('grid').addEventListener('contextmenu', (e) => { if (view === 'mine' && isTouch && e.target.closest('.card')) e.preventDefault(); });

  $('colNewFolder').onclick = () => createFolderFrom([]);
  $('colSelect').onclick = () => setSelecting(!selecting);
  $('selMove').onclick = openMoveSheet;
  $('selCancel').onclick = () => setSelecting(false);

  $('tabAll').onclick = () => setView('all');
  $('tabWish').onclick = () => setView('wish');
  $('tabEx').onclick = () => setView('ex');
  $('bell').onclick = openNotifications;
  $('pill').onclick = () => setView('mine');
  $('profileBtn').onclick = () => askProfile();
  $('colAdd').onclick = () => openFigureSheet();
  $('colBackup').onclick = openBackup;
  $('shareBtn').onclick = () => (view === 'wish' ? openWishShare() : openShare());
  $('colSync').onclick = openDirectMenu;
  $('wishClean').onclick = () => { wishlist = wishlist.filter((w) => !inCol(w.src)); persistWish(); render(); };
  $('scanBtn').onclick = openScanner;
  $('colClear').onclick = () => {
    const nCustom = collection.filter((c) => c.custom).length;
    if ((!collection.length && !folders.length) || !confirm(nCustom ? `Vider toute la collection ? Les ${nCustom} figurine(s) perso et leurs photos seront supprimées.` : 'Vider toute la collection ?')) return;
    if (nCustom) photoStore.clear();
    collection = [];
    folders = [];
    openFolder = null;
    setSelecting(false);
    drawFolderBar(false);
    persist();
    const els = [...document.querySelectorAll('.card')];
    found = []; shown = 0;
    fx.out(els, () => { $('grid').replaceChildren(); $('more').hidden = true; updateMeta(); });
  };
  $('more').onclick = () => { if (view === 'ex') { exPage++; loadEx(false); } else more(true); };
  $('dlg').addEventListener('click', (e) => { if (e.target === $('dlg') || e.target === $('lb')) $('dlg').close(); });
  let t;
  $('q').addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => { if (detailOpen) leaveDetail(); render(); }, 200);
  });

  persist();
  render();
  fx.intro();
  importFromHash();
  initExchange();

  // ---- PWA : service worker, invitation à installer sur l'écran d'accueil (mobile), état hors-ligne ----
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  const INSTALL_KEY = 'popmart-install-dismissed';
  const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isTouch = matchMedia('(pointer: coarse)').matches;
  const dismissedRecently = () => { try { return Date.now() - Number(localStorage.getItem(INSTALL_KEY)) < 14 * 864e5; } catch { return false; } };
  let installEvent = null;

  function hideInstall(remember) {
    $('install').hidden = true;
    if (remember) { try { localStorage.setItem(INSTALL_KEY, String(Date.now())); } catch {} }
  }

  function showInstall(ios) {
    if (isStandalone() || dismissedRecently() || !$('install').hidden) return;
    const icon = mk('img');
    icon.src = 'icons/icon-192.png'; icon.alt = '';
    const text = mk('div');
    text.append(mk('b', '', 'Installer Pop Mart'), mk('p', '', ios
      ? "Touchez Partager (le carré avec une flèche), puis « Sur l'écran d'accueil »."
      : "Ajoutez l'appli à votre écran d'accueil : accès rapide, et utilisable hors ligne."));
    const head = mk('div', 'head');
    head.append(icon, text);
    const btns = mk('div', 'btns');
    if (ios) btns.append(mkBtn('Compris', 'primary', () => hideInstall(true)));
    else btns.append(
      mkBtn('Installer', 'primary', async () => {
        if (!installEvent) return hideInstall(false);
        installEvent.prompt();
        const { outcome } = await installEvent.userChoice;
        installEvent = null;
        hideInstall(outcome !== 'accepted');
      }),
      mkBtn('Plus tard', '', () => hideInstall(true)),
    );
    $('install').replaceChildren(head, btns);
    $('install').hidden = false;
    fx.installIn();
  }

  addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    installEvent = e;
    if (isTouch) setTimeout(() => showInstall(false), 3000);
  });
  addEventListener('appinstalled', () => { installEvent = null; hideInstall(false); });
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS && isTouch) setTimeout(() => showInstall(true), 3000);

  const syncOnline = () => { $('offline').hidden = navigator.onLine; };
  addEventListener('online', syncOnline);
  addEventListener('offline', syncOnline);
  syncOnline();
</script>
</body>
</html>
